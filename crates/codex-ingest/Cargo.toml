[package]
name = "codex-ingest"
version = "0.1.0"
edition = "2024"

# SD-36 Epic A / operator ruling D1: the PCGen converter and oracle harness
# are KEPT (Starfinder needs them) but walled off in their own crate so the
# desktop can never link them. Dependency direction is codex-ingest -> codex,
# never the reverse; see crates/codex-ingest/src/lib.rs.
[dependencies]
codex = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
