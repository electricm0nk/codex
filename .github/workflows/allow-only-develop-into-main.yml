name: Allow only develop into main

'on':
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  delete:

permissions: {}

jobs:
  verify-source-branch:
    if: github.event_name == 'pull_request_target'
    name: Verify source branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR source branch is develop in this repository
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # The head repo must be this repository: a fork branch named
          # 'develop' must not satisfy the develop-into-main policy.
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Pull requests into main must come from this repository's develop branch."
            echo "Got head repo: $HEAD_REPO"
            exit 1
          fi

          if [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "Pull requests into main must come from develop. Got: $SOURCE_BRANCH"
            exit 1
          fi

  restore-develop-branch:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref == 'develop'
    name: Restore develop branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recreate develop from main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: mainRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main'
            });

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: 'heads/develop'
              });

              core.info('develop already exists; nothing to restore.');
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/heads/develop',
                sha: mainRef.object.sha
              });

              core.info(`Recreated develop at ${mainRef.object.sha}.`);
            }
