name: Deploy site to Cloudflare Pages

# Site-deploy lane for the campaign-codex.org landing page.
#
# Doctrine:
#   - Push to main on the site/ tree deploys the static site to the Cloudflare
#     Pages project named 'codex' (default URL: https://codex-3cc.pages.dev/,
#     custom domain: https://campaign-codex.org/).
#   - The workflow is path-filtered to site/** so unrelated code changes do
#     not trigger a deploy.
#   - The CLOUDFLARE_API_TOKEN repository secret must be present with the
#     Account: Cloudflare Pages (Edit) scope. The Pages project itself was
#     created via CLI; this workflow keeps it in sync with main.
#   - Manual dispatch (workflow_dispatch) is enabled for one-off deploys
#     without a push.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-site:
    name: Deploy site/ to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Serialize deploys so a fast second push does not race a slow first one.
      group: deploy-site
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a56ad609e87081550fcc3e50e36ec14f
        run: |
          set -euo pipefail
          wrangler pages deploy ./site \
            --project-name=codex \
            --branch=main \
            --commit-dirty=true
