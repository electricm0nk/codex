name: Publish tester release

# Publish official tester-channel release units from governed promotion sources only.
# develop -> alpha (prerelease)
# main    -> stable (non-prerelease)
# beta is reserved until a governed candidate promotion surface exists in repo/workflow truth.

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  publish-tester-release:
    name: Publish tester release (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Assert governed publication source
        run: |
          if [ "$GITHUB_REF_NAME" != "develop" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "ERROR: '$GITHUB_REF_NAME' is not a governed publication source."
            echo "Only 'develop' (alpha) and 'main' (stable) may create official tester-channel releases."
            echo "beta is reserved until a governed candidate promotion surface exists."
            exit 1
          fi

      - name: Resolve publication channel
        id: channel
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Linux artifact set
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage --ci

      - name: Stage release artifacts
        id: stage
        working-directory: apps/desktop
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)

          [ -n "$DEB" ] || { echo "ERROR: No .deb artifact found. E1 Linux artifact set may not yet be complete."; exit 1; }
          [ -n "$APPIMAGE" ] || { echo "ERROR: No .AppImage artifact found. E1 Linux artifact set may not yet be complete."; exit 1; }

          mkdir -p ../../release-staging
          cp "$DEB" ../../release-staging/
          cp "$APPIMAGE" ../../release-staging/

          echo "deb_name=$(basename "$DEB")" >> "$GITHUB_OUTPUT"
          echo "appimage_name=$(basename "$APPIMAGE")" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        working-directory: release-staging
        run: |
          sha256sum ./*.deb ./*.AppImage > checksums.sha256
          cat checksums.sha256

      - name: Write provenance receipt
        working-directory: release-staging
        run: |
          cat > provenance.json << EOF
          {
            "schema_version": "v1",
            "source_revision": "${GITHUB_SHA}",
            "source_branch": "${GITHUB_REF_NAME}",
            "channel": "${{ steps.channel.outputs.channel }}",
            "publication_run_id": "${GITHUB_RUN_ID}",
            "publication_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "platform": "linux",
            "support_tier": "first-class"
          }
          EOF

      - name: Write update manifest stub
        working-directory: release-staging
        run: |
          cat > update-manifest-stub.json << EOF
          {
            "schema_version": "stub-v0",
            "note": "Update manifest implementation is reserved for SD-12-E3. This stub preserves the publication-unit contract shape without claiming live updater support.",
            "channel": "${{ steps.channel.outputs.channel }}",
            "source_revision": "${GITHUB_SHA}",
            "update_check_wired": false
          }
          EOF

      - name: Derive release tag and title
        id: release_meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:8}"
          CHANNEL="${{ steps.channel.outputs.channel }}"
          echo "tag=${CHANNEL}-v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "title=${CHANNEL} v${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          DEB_NAME="${{ steps.stage.outputs.deb_name }}"
          APPIMAGE_NAME="${{ steps.stage.outputs.appimage_name }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > release-notes.md << NOTES_EOF
          ## Tester release -- channel: ${CHANNEL}

          **Tester channel:** ${CHANNEL}
          **Operator branch:** ${GITHUB_REF_NAME}
          **Source revision:** ${GITHUB_SHA}
          **Publication run:** ${RUN_URL}

          ## Platform scope

          | Platform | Tier | Update posture |
          |---|---|---|
          | Linux | First-class | Manual install only -- update checks not yet wired in this slice |
          | macOS | Second-class | Manual download only -- automatic updates not yet available |
          | Windows | Third-class | Explicitly bounded -- automatic updates not available in this tranche |

          ## Release assets

          - ${DEB_NAME} -- install-oriented Linux artifact
          - ${APPIMAGE_NAME} -- recovery/manual Linux artifact
          - checksums.sha256 -- SHA-256 checksums for all distributed assets
          - provenance.json -- build provenance and source-revision receipt
          - update-manifest-stub.json -- update manifest placeholder; full implementation reserved for SD-12-E3

          ## Channel notes

          - alpha builds originate from develop (fastest-moving tester track; highest churn)
          - stable builds originate from main (safest supported tester track)
          - beta is reserved until a governed candidate promotion surface exists in repo/workflow truth

          Update checks are not yet wired. Manual installation is required for this release.
          NOTES_EOF

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="${{ steps.release_meta.outputs.title }}"
          PRERELEASE="${{ steps.channel.outputs.prerelease }}"

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease \
              release-staging/*.deb \
              release-staging/*.AppImage \
              release-staging/checksums.sha256 \
              release-staging/provenance.json \
              release-staging/update-manifest-stub.json
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              release-staging/*.deb \
              release-staging/*.AppImage \
              release-staging/checksums.sha256 \
              release-staging/provenance.json \
              release-staging/update-manifest-stub.json
          fi
