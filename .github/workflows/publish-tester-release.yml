name: Publish tester release

# Publish official tester-channel release units from governed promotion sources only.
# develop -> alpha (prerelease)
# main    -> stable (non-prerelease)
# beta is reserved until a governed candidate promotion surface exists in repo/workflow truth.

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Run core crate tests
        run: cargo test --locked

      - name: Run desktop shell tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck frontend
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: apps/desktop
        run: npm test

  publish-tester-release:
    name: Publish tester release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Resolve publication channel
        id: channel
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Validate tranche release notes
        run: |
          python scripts/tranche/validate-tranche-notes.py --release-notes-path programs/codex/requirements/SD-16-feedback-loop-and-self-update-hardening/release-notes.md

      - name: Build Linux artifact set
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,appimage --ci

      - name: Stage release artifacts
        id: stage
        working-directory: apps/desktop
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)

          [ -n "$DEB" ] || { echo "ERROR: No .deb artifact found. E1 Linux artifact set may not yet be complete."; exit 1; }
          [ -n "$APPIMAGE" ] || { echo "ERROR: No .AppImage artifact found. E1 Linux artifact set may not yet be complete."; exit 1; }

          mkdir -p ../../release-staging
          DEB_NAME=$(basename "$DEB" | tr ' ' '.')
          APPIMAGE_NAME=$(basename "$APPIMAGE" | tr ' ' '.')
          cp "$DEB" "../../release-staging/$DEB_NAME"
          cp "$APPIMAGE" "../../release-staging/$APPIMAGE_NAME"

          echo "deb_name=$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "appimage_name=$APPIMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Write provenance receipt
        working-directory: release-staging
        run: |
          cat > provenance.json << EOF
          {
            "schema_version": "v1",
            "source_revision": "${GITHUB_SHA}",
            "source_branch": "${GITHUB_REF_NAME}",
            "channel": "${{ steps.channel.outputs.channel }}",
            "publication_run_id": "${GITHUB_RUN_ID}",
            "publication_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "platform": "linux",
            "support_tier": "first-class"
          }
          EOF

      - name: Generate update manifest
        id: generate_manifest
        working-directory: release-staging
        run: |
          set -euo pipefail

          # Two tag forms coexist for backward compatibility with deployed
          # tooling (F3c's channel-index URL uses the release tag verbatim):
          #   MANIFEST_TAG = schema-conformant `${channel}/${version}-${shortsha}`
          #                   (satisfies schemas/update/update-manifest.schema.json
          #                    tag pattern `^(alpha|beta|stable)/.+$`)
          #   RELEASE_TAG  = GitHub release tag `${channel}-${version}-${shortsha}`
          #                   (the existing form; used by gh release create
          #                    and F3c's MANIFEST_URL)
          VERSION=$(node -p "require('${GITHUB_WORKSPACE}/apps/desktop/package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:8}"
          CHANNEL="${{ steps.channel.outputs.channel }}"
          MANIFEST_TAG="${CHANNEL}/v${VERSION}-${SHORT_SHA}"
          RELEASE_TAG="${CHANNEL}-v${VERSION}-${SHORT_SHA}"
          APPIMAGE_NAME="${{ steps.stage.outputs.appimage_name }}"
          APPIMAGE_PATH="${GITHUB_WORKSPACE}/release-staging/${APPIMAGE_NAME}"
          APPIMAGE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APPIMAGE_NAME}"
          RELEASE_NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          python3 ../scripts/release/write_release_manifest.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --channel "${CHANNEL}" \
            --tag "${MANIFEST_TAG}" \
            --version "${VERSION}" \
            --source-branch "${GITHUB_REF_NAME}" \
            --source-commit "${GITHUB_SHA}" \
            --release-notes-path "programs/codex/requirements/SD-16-feedback-loop-and-self-update-hardening/release-notes.md" \
            --appimage-name "${APPIMAGE_NAME}" \
            --appimage-path "${APPIMAGE_PATH}" \
            --appimage-url "${APPIMAGE_URL}" \
            --workflow ".github/workflows/publish-tester-release.yml" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --release-notes-url "${RELEASE_NOTES_URL}" \
            --min-supported-version "${VERSION}" \
            --appimage-install "true" \
            --required-install-kind "appimage" \
            --output update-manifest.json

          # Legacy alias for F3c's channel-index URL: F3c is merged and
          # references `update-manifest-stub.json`. The stub is now a
          # verbatim copy of the schema-valid manifest under the legacy
          # filename, so the index's MANIFEST_URL still resolves to a
          # manifest that satisfies the schema.
          cp update-manifest.json update-manifest-stub.json

          echo "manifest-tag=${MANIFEST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release-tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Install Python dependencies
        run: |
          python3 -m ensurepip --upgrade || true
          python3 -m pip install --quiet --no-cache-dir jsonschema==4.21.1

      - name: Validate update manifest
        working-directory: release-staging
        run: |
          set -euo pipefail
          python3 -m ensurepip --upgrade || true
          python3 -m pip install --quiet --no-cache-dir jsonschema==4.21.1
          python3 ../scripts/release/validate_manifest.py \
            --manifest update-manifest.json \
            --schema ../schemas/update/update-manifest.schema.json

      - name: Compute checksums
        working-directory: release-staging
        run: |
          sha256sum ./*.deb ./*.AppImage provenance.json update-manifest.json update-manifest-stub.json > checksums.sha256
          cat checksums.sha256

      - name: Derive release tag and title
        id: release_meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:8}"
          CHANNEL="${{ steps.channel.outputs.channel }}"
          echo "tag=${CHANNEL}-v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "title=${CHANNEL} v${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          DEB_NAME="${{ steps.stage.outputs.deb_name }}"
          APPIMAGE_NAME="${{ steps.stage.outputs.appimage_name }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > release-notes.md << NOTES_EOF
          ## Tester release -- channel: ${CHANNEL}

          **Tester channel:** ${CHANNEL}
          **Operator branch:** ${GITHUB_REF_NAME}
          **Source revision:** ${GITHUB_SHA}
          **Publication run:** ${RUN_URL}

          ## Platform scope

          | Platform | Tier | Update posture |
          |---|---|---|
          | Linux | First-class | Manual install only -- update checks not yet wired in this slice |
          | macOS | Second-class | Not shipped in this release unit -- automatic updates not yet available |
          | Windows | Third-class | Not shipped in this release unit -- automatic updates not available |

          ## Release assets

          - ${DEB_NAME} -- install-oriented Linux artifact
          - ${APPIMAGE_NAME} -- recovery/manual Linux artifact
          - checksums.sha256 -- SHA-256 checksums for all distributed assets
          - provenance.json -- build provenance and source-revision receipt
          - update-manifest-stub.json -- update manifest placeholder; full implementation reserved for SD-12-E3

          ## Channel notes

          - alpha builds originate from develop (fastest-moving tester track; highest churn)
          - stable builds originate from main (safest supported tester track)
          - beta is reserved until a governed candidate promotion surface exists in repo/workflow truth

          Update checks are not yet wired. Manual installation is required for this release.
          NOTES_EOF

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="${{ steps.release_meta.outputs.title }}"
          PRERELEASE="${{ steps.channel.outputs.prerelease }}"

          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            "${EXTRA_FLAGS[@]}" \
            release-staging/*.deb \
            release-staging/*.AppImage \
            release-staging/checksums.sha256 \
            release-staging/provenance.json \
            release-staging/update-manifest-stub.json

      # Channel-index update: the only legitimate writer of the protected
      # `update-index` branch in the normal path. Pushes channels/<channel>.json
      # containing the published manifest URL, release tag, publication
      # timestamp, and tranche id. Restricted to push events on develop/main
      # so workflow_dispatch / pull_request / fork reruns cannot poison the
      # index. Fails closed when no tranche manifest matches the source
      # branch -- never writes a partial index. Two-step design: the
      # preparation step stages the JSON into the workspace and exports
      # metadata via $GITHUB_ENV; the action step picks it up and pushes it
      # directly to update-index (push-to-current-branch + branch=
      # update-index; this is NOT a PR -- the channel index is a continuous
      # pointer, not a review artifact).
      - name: Prepare channel index payload
        if: success() && github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && hashFiles('programs/codex/requirements/SD-16-feedback-loop-and-self-update-hardening/tranche-*/manifest.yaml') != ''
        id: channel_index_prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${CHANNEL:-}" ] || [ -z "${TAG:-}" ]; then
            echo "::error::channel-index: missing CHANNEL or TAG from upstream steps"
            exit 1
          fi

          # Resolve tranche_id. Prefer the E1 locate_manifest step output if
          # present; otherwise walk programs/codex/requirements/SD-16-...
          # for a manifest.yaml whose promotion_branch matches the source
          # branch. Fail closed if nothing matches.
          TRANCHE_ID=""
          MANIFEST_PATH="${{ steps.locate_manifest.outputs.manifest }}"
          if [ -n "${MANIFEST_PATH:-}" ] && [ -f "${MANIFEST_PATH}" ]; then
            TRANCHE_ID="$(awk -F': *' '/^tranche_id:/{gsub(/["'\'' ]/,"",$2); print $2; exit}' "${MANIFEST_PATH}")"
          fi
          if [ -z "${TRANCHE_ID}" ]; then
            FOUND="$(find programs/codex/requirements/SD-16-feedback-loop-and-self-update-hardening/tranche-* -maxdepth 2 -name 'manifest.yaml' 2>/dev/null | while read -r f; do
              PB="$(awk -F': *' '/^promotion_branch:/{gsub(/["'\'' ]/,"",$2); print $2; exit}' "$f")"
              if [ "${PB}" = "${GITHUB_REF_NAME}" ]; then
                echo "$f"
                exit 0
              fi
            done | head -1 || true)"
            if [ -n "${FOUND:-}" ] && [ -f "${FOUND}" ]; then
              TRANCHE_ID="$(awk -F': *' '/^tranche_id:/{gsub(/["'\'' ]/,"",$2); print $2; exit}' "${FOUND}")"
            fi
          fi
          if [ -z "${TRANCHE_ID}" ]; then
            echo "::error::channel-index: no tranche manifest found for promotion_branch=${GITHUB_REF_NAME} (looked in steps.locate_manifest.outputs.manifest and programs/codex/requirements/SD-16-feedback-loop-and-self-update-hardening/tranche-*/manifest.yaml)"
            exit 1
          fi

          # Resolve publication timestamp from the live release API so the
          # same tag always produces the same index payload (idempotent).
          PUBLISHED_AT="$(gh release view "${TAG}" --json publishedAt --jq '.publishedAt')"
          if [ -z "${PUBLISHED_AT}" ] || [ "${PUBLISHED_AT}" = "null" ]; then
            echo "::error::channel-index: gh release view returned no publishedAt for tag=${TAG}"
            exit 1
          fi

          MANIFEST_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/update-manifest-stub.json"
          NOTES_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          # Deterministic JSON payload (sorted keys via jq -S). signature is
          # reserved (Tranche 2.5 does not sign channel indexes).
          INDEX_JSON="$(jq -n \
            --arg sv "v1" \
            --arg ch "${CHANNEL}" \
            --arg tag "${TAG}" \
            --arg pa "${PUBLISHED_AT}" \
            --arg mu "${MANIFEST_URL}" \
            --arg nu "${NOTES_URL}" \
            --arg tid "${TRANCHE_ID}" \
            '{channel: $ch, release: {manifest_url: $mu, notes_url: $nu, published_at: $pa, tag: $tag, tranche_id: $tid}, schema_version: $sv, signature: null}' \
            | jq -S .)"

          # Stage into the workspace first, then serialize the payload into
          # $GITHUB_ENV so the update-index writer can restore it after
          # checking out the target branch.
          mkdir -p channels
          printf '%s\n' "${INDEX_JSON}" > "channels/${CHANNEL}.json"

          # Self-check: the staged file must parse as JSON.
          python3 -c "import json; json.load(open('channels/${CHANNEL}.json'))"

          # Export to subsequent steps via $GITHUB_ENV (so the action step
          # can reference them as ${{ env.* }}).
          {
            echo "CHANNEL=${CHANNEL}"
            echo "TAG=${TAG}"
            echo "PUBLISHED_AT=${PUBLISHED_AT}"
            echo "MANIFEST_URL=${MANIFEST_URL}"
            echo "NOTES_URL=${NOTES_URL}"
            echo "TRANCHE_ID=${TRANCHE_ID}"
            echo "COMMIT_MESSAGE=channel-index: ${CHANNEL} ${TAG} (tranche ${TRANCHE_ID})"
            echo "CHANNEL_INDEX_JSON_B64=$(printf '%s' "${INDEX_JSON}" | base64 -w0)"
          } >> "${GITHUB_ENV}"

          echo "channel-index: prepared channels/${CHANNEL}.json (channel=${CHANNEL}, tag=${TAG}, tranche=${TRANCHE_ID}, published_at=${PUBLISHED_AT})"

      - name: Update channel index on update-index branch
        if: success() && github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && hashFiles('programs/codex/requirements/SD-16-feedback-loop-and-self-update-hardening/tranche-*/manifest.yaml') != ''
        run: |
          set -euo pipefail

          if [ -z "${CHANNEL:-}" ] || [ -z "${COMMIT_MESSAGE:-}" ] || [ -z "${CHANNEL_INDEX_JSON_B64:-}" ]; then
            echo "::error::channel-index: missing CHANNEL, COMMIT_MESSAGE, or CHANNEL_INDEX_JSON_B64"
            exit 1
          fi

          FILE="channels/${CHANNEL}.json"

          git reset --hard HEAD
          git clean -fd

          if git ls-remote --exit-code --heads origin update-index >/dev/null 2>&1; then
            git fetch origin update-index:refs/remotes/origin/update-index
            git checkout -B update-index refs/remotes/origin/update-index
          else
            git checkout --orphan update-index
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p channels
          printf '%s' "${CHANNEL_INDEX_JSON_B64}" | base64 -d > "${FILE}"
          python3 -c "import json; json.load(open('${FILE}'))"

          git add "${FILE}"
          if git diff --cached --quiet; then
            echo "channel-index: no changes for ${FILE}; update-index is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${COMMIT_MESSAGE}"
          git push origin HEAD:update-index
            release-staging/update-manifest.json
