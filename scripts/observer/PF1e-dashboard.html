  // Round 12 fix (finding #4): the bar alone drops the "every rung visible,
  // including zero" guarantee the file's own doctrine comment above
  // donenessBarHtml/donenessLegendHtml requires the two to always ship
  // together -- this was the only place on the page calling the bar without
  // its legend, and it's now the only place the excluded/unmeasurable count
  // for a row is visible at all (compounds finding #2), so pairing them here
  // fixes both the book-x-kind panel and viewBooks, which shares this cell.
  return `<div style="min-width:140px">${donenessBarHtml(by, units)}${donenessLegendHtml(by)}</div>`;
}

function viewBooks() {
  const wi = DATA.work_inventory || {};
  const curated = DATA.books || [];
  const curatedInv = new Set(curated.map((b) => INVENTORY_ID_ALIASES[b.id] || b.id));

  const rowsCurated = curated.map((b) => {
    const inv = inventoryFor(b.id);
    const units = inv ? inv.units : null;
    const by = inv ? (inv.by_doneness || {}) : {};
    const done = inv ? (by["done"] || 0) : null;
    const covDenom = inv ? usableDenom(by, units) : null;
    return `<tr onclick="location.hash='#/book/${esc(b.id)}'" style="cursor:pointer">
      <td>${esc(b.title || b.id)}</td>
      <td class="mono" style="color:var(--muted)">${b.channel ? esc(b.channel) : `<span class="na">n/a</span>`}</td>
      <td>${esc(b.status || "")}</td>
      <td class="num">${units == null ? `<span class="na">n/a</span>` : num(units)}</td>
      <td class="num">${inv ? pctCell(done, covDenom) : `<span class="na">n/a</span>`}</td>
      <td>${inv ? bookDonenessCell(inv.by_doneness, units) : `<span class="na">n/a</span>`}</td>
    </tr>`;
  }).join("");

  /* Books the inventory knows about that the curated list never shows. These
     were previously invisible on this dashboard entirely -- including
     `bestiary`, which is in_scope and carries over a thousand units. */
  const extras = (wi.books || []).filter((b) => !curatedInv.has(b.id));
  const rowsExtra = extras.sort((a, b) => (b.units || 0) - (a.units || 0)).map((b) => {
    const bBy = b.by_doneness || {};
    const done = bBy["done"] || 0;
    const covDenom = usableDenom(bBy, b.units);
    return `
    <tr>
      <td>${esc(titleCase(b.id))}</td>
      <td class="mono" style="color:var(--muted)">${esc(b.scope || "")}</td>
      <td><span class="na">n/a</span></td>
      <td class="num">${num(b.units)}</td>
      <td class="num">${pctCell(done, covDenom)}</td>
      <td>${bookDonenessCell(b.by_doneness, b.units)}</td>
    </tr>`;
  }).join("");

  const head = `<thead><tr><th>Book</th><th>Channel / scope</th><th>Stage</th>
    <th class="num">Records</th><th class="num">Fully usable</th><th>How usable — full breakdown</th></tr></thead>`;

  el("view").innerHTML =
    `<div class="section-title">Curated books (${curated.length})</div>
     <div class="pct-caption">“Fully usable” = a player can rely on the record without caveats
       (see the overview page for what that means). The bar in the last column always shows
       every stage, including zero, so a thin sliver at the left and a long grey tail is
       “recorded but not yet checked”, not “broken”.</div>
     <div class="table-wrap"><table>${head}<tbody>${rowsCurated}</tbody></table></div>` +
    (extras.length ? `<div class="section-title">Also in the work inventory (${extras.length})</div>
     <div class="result-note">Present in the corpus inventory but not on the curated board.</div>
     <div class="table-wrap"><table>${head}<tbody>${rowsExtra}</tbody></table></div>` : "");
}

/* Book x kind cross (round 11, operator UI-first reframe, 2026-08-12): the
   gap the very first brief flagged and round 1-10 correctly left alone
   ("adding it would mean crossing status, wiring_class AND book AND kind in
   one structure, which the producer does not compute today" -- renderByLane's
   comment above; that comment is now stale, corrected there too). Answers
   "how usable is THIS book's equipment specifically", not "equipment
   corpus-wide" (renderByLane) or "this book overall" (the card above).
   Placed per-book rather than as one 37-book x 11-kind mega-table: a reader
   who wants Ultimate Equipment's equipment already navigated to Ultimate
   Equipment's own page, and a table scoped to one book's actual kinds reads
   in one glance where a 400-cell matrix would not. A kind this book has ZERO
   records of is left OFF the table entirely, not shown as `0` or `n/a` --
   there is nothing missing to report; the content type simply doesn't exist
   in this book (e.g. Ultimate Equipment has no `class` records), which is a
   different fact from "we didn't check". */
function renderBookKindCross(bookId) {
  const wi = DATA.work_inventory || {};
  const target = INVENTORY_ID_ALIASES[bookId] || bookId;
  const byKind = (wi.by_doneness_book_kind || {})[target];
  if (!byKind || !Object.keys(byKind).length) {
    return `<div class="pct-caption" style="margin-top:0.6em">No per-content-type breakdown
      available for this book in the current payload.</div>`;
  }
  const kinds = Object.keys(byKind);
  const order = LANE_ORDER.filter((k) => kinds.includes(k))
    .concat(kinds.filter((k) => !LANE_ORDER.includes(k)));
  const rows = order.map((kind) => {
    const by = byKind[kind] || {};
    const units = Object.values(by).reduce((a, v) => a + v, 0);
    if (!units) return "";
    const done = by["done"] || 0;
    const covDenom = usableDenom(by, units);
    // Round 12 fix (finding #2): "Records" (raw unit count) and "Fully
    // usable %" (done / covDenom) use different denominators whenever any
    // records were excluded as unmeasurable/deferred -- same gap the card
    // above this panel, renderByLane, and viewCorpus all already close by
    // stating the checkable denominator inline. Mirror that pattern here:
    // show the excluded count next to the percentage whenever units and
    // covDenom diverge, so a reader can't multiply Records x % and get a
    // number nobody meant.
    const denomNote = units !== covDenom
      ? `<div class="pct-caption" style="margin:0.15em 0 0">${num(done)} / ${num(covDenom)} checkable${
         excludedClause(by["unmeasurable"] || 0, by["deferred"] || 0)}</div>`
      : "";
    // Round 12 fix (finding #1): spell/companion have no automated
    // confirming check at all (NO_GROUNDING_PROBE) so their `done` count is
    // structurally 0 regardless of how much real, held data is on file --
    // exactly the "disguised zero" the new charter forbids showing without a
    // caveat. renderByLane, viewCorpus, and the kind page all already attach
    // this note per-kind; this panel was the one surface missing it. Kept
    // per-row (not a single top-of-table footnote) so it stays attached to
    // the specific row it explains, matching how thin a table this is.
    // Round 13 fix (finding #1): the caveat is only true when there's real
    // evidence on file (done/held/in-progress > 0) that the missing probe is
    // preventing from reaching `done`. On a row that's 100% `not-started`
    // (e.g. Core Rulebook companion: {not-started: 170}, zero everything
    // else), there's nothing for a probe to excuse -- the plain 0.0% reading
    // is simply correct, and the "gap in the checking tool" framing would
    // contradict the adjacent legend's own "nothing done yet" count. Gate on
    // there being something to excuse.
    // Round 16 fix (finding #3): this row used to carry its own inline copy
    // of the exact same gate+wording as probelessCaveat() (round 14's report
    // flagged it but left it untouched pending scope) -- two copies of one
    // gate is precisely the shape that let rounds 13-14 land a fix in one
    // spot and not the other. Now calls the shared helper directly, with the
    // per-row book-scoped `by` ladder it already has on hand and a margin
    // matching this table's own inline spacing.
    const probelessNote = probelessCaveat(kind, by, "0.15em 0 0");
    // Round 12 fix (finding #3): clicking used to always land on the
    // corpus-wide `#/kind/<kind>` figure with no indication the scope just
    // changed from "this book" to "every book". The book id used to look up
    // `byKind` above (`target`) is the same id the shard rows and
    // `by_doneness_book_kind` both key on, so it can be carried straight
    // through the hash and applied as the existing bookSel filter -- no new
    // plumbing needed, viewUnits/renderUnitsShell already accept it.
    return `<tr onclick="location.hash='#/kind/${esc(kind)}?book=${esc(target)}'" style="cursor:pointer">
      <td>${esc(titleCase(kind))}</td>
      <td class="num">${num(units)}</td>
      <td class="num">${pctCell(done, covDenom)}${denomNote}${probelessNote}</td>
      <td>${bookDonenessCell(by, units)}</td>
    </tr>`;
  }).join("");
  if (!rows) {
    return `<div class="pct-caption" style="margin-top:0.6em">This book has no records of any
      content type our checker currently tracks.</div>`;
  }
  return `
    <div class="section-title" style="margin-top:1em">How usable is each content type in this book?</div>
    <div class="pct-caption">Same "fully usable" measure as elsewhere on this page, scored
      per content type against that type's own bar. A content type this book has no records of
      at all is left off this table — nothing to measure, not a gap. Clicking a row opens that
      content type's full record list pre-filtered to this book.</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Content type</th><th class="num">Records</th><th class="num">Fully usable</th>
        <th>How usable — full breakdown</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function viewBook(m) {
  const b = (DATA.books || []).find((x) => x.id === m[1]);
  if (!b) { el("view").innerHTML = `<div class="banner err">Unknown book "${esc(m[1])}".</div>`; return; }
  const inv = inventoryFor(b.id);
  let html = `<div class="section-title">${esc(b.title || b.id)}</div>`;

  if (inv) {
    const by = inv.by_doneness || {};
    const done = by["done"] || 0;
    const unmeasurable = by["unmeasurable"] || 0;
    const deferred = by["deferred"] || 0;
    const covDenom = usableDenom(by, inv.units);
    // Round 13 fix (finding #2, book-card arithmetic): this note used to
    // show `unmeasurable` alone as the excluded count, silently dropping
    // `deferred` from both the number and the label -- units minus covDenom
    // (which correctly subtracts both) didn't reconcile with the displayed
    // figure whenever a book had any deferred records (e.g. Core Rulebook:
    // unmeasurable-only said "517 excluded" but units - covDenom = 524, the
    // missing 7 being exactly Core Rulebook's deferred count). Use the same
    // split-clause helper as denomNote so the number always reconciles and
    // deferred is labeled as intentional exclusion, not a tooling gap.
    html += `<div class="grid"><div class="card flat">
      <h3>How usable is this book?</h3><div class="sub">${esc(inv.scope || "")} · ${num(inv.units)} records</div>
      <div class="metric"><span class="n">${pctCell(done, covDenom)}</span>
        <span class="of">${num(done)} / ${num(covDenom)} fully usable${excludedClause(unmeasurable, deferred)}</span></div>
      ${donenessBarHtml(by, inv.units)}${donenessLegendHtml(by)}</div></div>`;
    html += renderBookKindCross(b.id);
    html += `
      <details style="margin-top:0.8em">
        <summary style="cursor:pointer;color:var(--muted);font-size:0.82em">For engineers — raw status/wiring_class mix</summary>
        <div class="pct-caption" style="margin-top:0.4em">status</div>
        ${miniBar(inv.by_status || {}, inv.units)}
        <div class="pct-caption" style="margin-top:0.6em">wiring_class — what kind of evidence each unit needs, orthogonal to status above. <code>ambiguous</code> never resolves to "done": an unresolved classification is capped at what the <code>static</code>/<code>derived</code> fidelity bar would allow, so it can only cost credit, never gain it — any real evidence status (<code>grounded</code>/<code>text-complete</code>/<code>ingested-magnitude</code>) under <code>ambiguous</code> lands in "held".</div>
        ${wiringMiniBar(inv.by_wiring_class || {}, inv.units)}
        <div class="legend">${wiringLegend(inv.by_wiring_class || {})}</div>
      </details>`;
  } else {
    html += `<div class="banner warn">No work-inventory record joins to this book id
      (<code>${esc(b.id)}</code>), so unit counts are unknown rather than zero.</div>`;
  }

  const mx = b.matrix || {};
  if (Object.keys(mx).length) {
    html += `<div class="section-title">Coverage</div><div class="table-wrap"><table>
      <thead><tr><th>Area</th><th>State</th><th>Open question</th></tr></thead><tbody>` +
      Object.keys(mx).map((k) => `<tr>
        <td>${esc(titleCase(k))}</td>
        <td>${mx[k] === "✓" ? '<span style="color:var(--full)">✓</span>' : `<span style="color:var(--err)">${esc(mx[k])}</span>`}</td>
        <td class="note-body">${esc((b.open_questions || {})[k] || "")}</td>
      </tr>`).join("") + `</tbody></table></div>`;
  }
  el("view").innerHTML = html;
}

/* ---- classes / races ---- */

function matrixTable(rows, label) {
  if (!rows.length) return `<div class="empty">No ${esc(label)} in this payload.</div>`;
  const full = rows.filter((r) => r.state === "full").length;
  return `<div class="section-title">${esc(label)} — ${full} of ${rows.length} complete</div>
    <div class="table-wrap"><table>
    <thead><tr><th>Name</th><th>Book</th><th>Channel</th><th>State</th><th>Open question</th></tr></thead>
    <tbody>` + rows.map((r) => `<tr>
      <td>${esc(r.name || titleCase(r.id))}</td>
      <td class="mono" style="color:var(--muted)">${esc(r.book || "")}</td>
      <td class="mono" style="color:var(--muted)">${esc(r.channel || "")}</td>
      <td><span class="pill" style="color:${r.state === "full" ? "var(--full)" : r.state === "partial" ? "var(--partial)" : "var(--muted)"}">
        ${esc(r.marker || "")} ${esc(r.state || "")}</span></td>
      <td class="note-body">${esc(r.open_question || "")}</td>
    </tr>`).join("") + `</tbody></table></div>`;
}

/* Prestige-class records are a different shape: no `state`, just a
   `todo_template` of queued tasks. Feeding them to matrixTable() renders a
   column of blanks that reads as "failed" when the truth is "not started, and
   not yet in an active channel". */
function prestigeTable(rows) {
  const stateOf = (r) => {
    const tasks = r.todo_template || [];
    if (!tasks.length) return ["unknown", 0, 0];
    const done = tasks.filter((t) => t.status === "complete" || t.status === "done").length;
    return [done === tasks.length ? "full" : done ? "partial" : "queued", done, tasks.length];
  };
  const byChannel = {};
  rows.forEach((r) => { (byChannel[r.channel || "(none)"] ||= []).push(r); });
  const started = rows.filter((r) => stateOf(r)[1] > 0).length;

  return `<div class="section-title">Prestige / unchained classes — ${rows.length} queued,
      ${started} started</div>
    <div class="result-note">Scheduled into future workchannels; these carry a task template
      rather than an engine state, so they are <strong>not started</strong>, not failing.</div>
    <div class="table-wrap"><table>
    <thead><tr><th>Name</th><th>Book</th><th>Channel</th><th class="num">Tasks done</th><th>Pre-wire</th></tr></thead>
    <tbody>` + Object.keys(byChannel).sort().flatMap((ch) =>
      byChannel[ch].map((r) => {
        const [state, done, tot] = stateOf(r);
        return `<tr>
          <td>${esc(r.name || titleCase(r.id))}</td>
          <td class="mono" style="color:var(--muted)">${esc(r.book || "")}</td>
          <td class="mono" style="color:var(--muted)">${esc(ch)}</td>
          <td class="num" style="color:${state === "full" ? "var(--full)" : state === "partial" ? "var(--partial)" : "var(--muted)"}">${done}/${tot}</td>
          <td>${r.pre_wire_required ? '<span style="color:var(--warn)">required</span>' : "—"}</td>
        </tr>`;
      })).join("") + `</tbody></table></div>`;
}

function viewClasses() {
  const mx = DATA.matrix || {};
  el("view").innerHTML = matrixTable(mx.classes || [], "Classes") +
    ((mx.prestige_classes || []).length ? prestigeTable(mx.prestige_classes) : "");
}
function viewRaces() {
  const mx = DATA.matrix || {};
  const note = mx.races_note;
  el("view").innerHTML = matrixTable(mx.races || [], "Races") +
    (note ? `<div class="banner info" style="margin-top:1em">
      <strong>${esc(titleCase(note.book))} — ${note.declared_races} declared races
      (${esc(note.ruling)}).</strong><div class="note-body">${esc(note.note)}</div></div>` : "");
}

/* ---- decisions ---- */

function viewDecisions() {
  const dec = ((DATA.channels || {})["v0.6"] || {}).decisions || {};
  const group = (title, items) => !items || !items.length ? "" :
    `<div class="section-title">${esc(title)} (${items.length})</div>` +
    items.map((d) => `<div class="card flat" style="margin-bottom:0.6em">
      <h3>${esc(d.title || d.item_id)}</h3>
      <div class="sub">${esc(d.section || "")} · ${esc(d.status_label || "")} · ${esc(d.category || "")}</div>
      <div class="note-body">${esc(d.call_text || d.body || "")}</div>
    </div>`).join("");
  const html = group("Open — awaiting a call", dec.open) +
               group("Autonomous", dec.autonomous) +
               group("Resolved", dec.resolved);
  el("view").innerHTML = html || `<div class="empty">No decisions in this payload.</div>`;
}

/* ======================= boot ======================= */

// Round 28 fix (supervisor CSS-defect finding, 2026-08-13): the single
// runtime source of truth for "how tall is the sticky header right now",
// consumed by both `.crumbs { top: ... }` and `.crumbs { scroll-margin-top:
// ... }` in the stylesheet via the `--header-height` custom property (see
// comments there). Measured, not hardcoded, because the header's height is
// content-dependent (usage gauges, completion summary, and the round-27
// lane-strip chips can each wrap depending on viewport width) and would
// silently go stale otherwise. A ResizeObserver on #header re-runs this
// automatically whenever the header's rendered size changes for ANY reason
// -- window resize, data refresh changing the chip strip's content/count,
// font loading, etc. -- so this one function is the only place that ever
// needs to know the header's height.
function syncHeaderHeight() {
  const header = el("header");
  if (!header) return;
  document.documentElement.style.setProperty("--header-height", header.offsetHeight + "px");
}
if (typeof ResizeObserver !== "undefined") {
  const headerEl = el("header");
  if (headerEl) new ResizeObserver(syncHeaderHeight).observe(headerEl);
} else {
  // Fallback for an environment without ResizeObserver: at least track
  // viewport resizes, which is the most common trigger for lane-strip
  // rewrapping. Won't catch a same-size-viewport content change, but that's
  // strictly better than the old hardcoded-nothing behavior.
  window.addEventListener("resize", syncHeaderHeight);
}

window.addEventListener("hashchange", routeAndScroll);

async function main() {
  const ok = await loadData();
  if (!ok && !DATA) { el("view").innerHTML = ""; return; }
  renderUsage();
  renderCompletion();
  syncHeaderHeight(); // synchronous measurement -- don't wait on the
  // ResizeObserver's next tick before the first route()/routeAndScroll()
  // can run against an up-to-date --header-height.
  route();

  setInterval(async () => {
    const before = DATA && DATA.generated_at;
    if (await loadData()) {
      renderUsage();
      renderCompletion();
      syncHeaderHeight(); // header content (lane chips) can change on a
      // refresh tick even without a full route(); keep --header-height
      // synchronous with it rather than waiting on the ResizeObserver.
      // Round 22 QA finding 3: renderCompletion() above rewrites the lane
      // cards' HTML on EVERY tick, regardless of whether the payload
      // actually changed -- which wipes any `selected-lane` class route()
      // had applied earlier. route() only re-runs (and only THAT re-
      // applies the highlight, via updateLaneSelection()) when the payload's
      // generated_at changed AND the current page isn't `#/kind/*` -- so on
      // a `#/kind/*` page the highlight was gone for good after the first
      // tick, and on a `#/lane/*` page it was gone on most ticks (payload
      // regenerates every ~5min, this poll runs every ~1min). Re-apply it
      // here, every tick THAT SUCCESSFULLY LOADS (i.e. every time this
      // `if (await loadData())` branch is entered — not literally
      // unconditionally, a failed fetch skips this whole block and leaves
      // the previous highlight in place until the next successful tick),
      // the same way route() derives the active lane/kind from the hash —
      // independent of whether a full route() re-run happens below. In
      // practice this is paired with renderCompletion() two lines up, which
      // is in the same branch and is the actual reason the highlight needs
      // reapplying, so the two have never been observed to disagree.
      const hashPath = (location.hash || "#/").slice(1);
      const laneOrKindMatch = hashPath.match(/^\/(?:lane|kind)\/([\w-]+)/);
      updateLaneSelection(laneOrKindMatch ? laneOrKindMatch[1] : null);
      // Only re-render the body when the payload actually changed, so an
      // operator mid-search does not have their filters yanked out from under
      // them every minute.
      if (DATA.generated_at !== before && !location.hash.startsWith("#/kind/")) route();
      else renderCrumbs(currentRoute());
    }
  }, REFRESH_MS);
}

main();
</script>
</body>
</html>
