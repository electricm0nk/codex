      <div class="pct-caption">${esc(axisLabel)} — ${num(total)} records across ${num(keys.length)} raw
        source categories. <strong>That's too fine-grained to be a useful breakdown on its own</strong> —
        most of it is one row per class/archetype/subrace naming convention in the source data, not a
        considered category system; browse individual records at the book level above instead.
        ${majorityNote}</div>
      <div class="pct-caption" style="margin-top:0.4em">Top ${num(topKeys.length)} groups by record count, for context:</div>
      ${categoryTableHtml(axisLabel, topRows)}
      <details style="margin-top:0.6em">
        <summary class="pct-caption" style="cursor:pointer">Show all ${num(keys.length)} raw categories (for engineers / the curious)</summary>
        ${categoryTableHtml(axisLabel, allRows)}
      </details>`;
  }

  const rows = keys.map((cat) => categoryRowHtml(cat, categories[cat])).join("");
  return `
    <div class="pct-caption">${esc(axisLabel)} — ${num(total)} records across ${num(keys.length)} groups.
      ${majorityNote}</div>
    ${categoryTableHtml(axisLabel, rows)}`;
}

function viewLane(m) {
  const kind = m[1];
  const wi = DATA.work_inventory || {};
  const bookKind = wi.by_doneness_book_kind || {};
  const label = LANE_LABEL[kind] || titleCase(kind);
  const capability = LANE_CAPABILITY[kind] ||
    `We don't yet have a written definition of "fully usable" for this content type.`;

  const bookIds = Object.keys(bookKind).filter((b) => (bookKind[b][kind] || null) &&
    Object.values(bookKind[b][kind]).reduce((a, v) => a + v, 0) > 0);
  bookIds.sort((a, b) => bookTitleFor(a).localeCompare(bookTitleFor(b)));

  const lvl1 = (wi.by_doneness_kind || {})[kind] || {};
  const lvl1Total = Object.values(lvl1).reduce((a, v) => a + v, 0);

  const cards = bookIds.map((bid) => {
    const by = bookKind[bid][kind] || {};
    const units = Object.values(by).reduce((a, v) => a + v, 0);
    const done = by["done"] || 0;
    const covDenom = usableDenom(by, units);
    const probelessNote = probelessCaveat(kind, by);
    return `<div class="card flat" onclick="location.hash='#/kind/${esc(kind)}?book=${esc(bid)}'" style="cursor:pointer">
      <h3>${esc(bookTitleFor(bid))}</h3>
      <div class="sub">${num(units)} records</div>
      <div class="metric"><span class="n">${pctCell(done, covDenom)}</span>
        <span class="of">${num(done)} / ${num(covDenom)} fully usable${excludedClause(by["unmeasurable"] || 0, by["deferred"] || 0)}</span></div>
      ${donenessBarHtml(by, units)}
      ${donenessLegendHtml(by)}
      ${probelessNote}
      <div class="pct-caption" style="margin-top:0.5em">See individual ${esc(titleCase(kind))} records &rarr;</div>
    </div>`;
  }).join("");

  // Reconciliation, computed and asserted live (not just claimed in the
  // report) rather than trusted: the per-book cards above must sum to
  // exactly the level-1 lane total this same kind shows on the landing page,
  // since by_doneness_book_kind and by_doneness_kind are two independently
  // maintained margins of the same underlying units.
  const bookSum = bookIds.reduce((a, bid) =>
    a + Object.values(bookKind[bid][kind] || {}).reduce((s, v) => s + v, 0), 0);
  if (lvl1Total && bookSum !== lvl1Total) {
    console.error(`level2/level1 mismatch: lane ${kind} books sum to ${bookSum}, lane total is ${lvl1Total}`);
  }

  const idx = DATA.unit_index || {};
  const kindMeta = (idx.kinds || {})[kind] || {};
  const axisLabel = kindMeta.category_axis_label || "Category";
  const categorySection = kindMeta.categories
    ? categoryBreakdownHtml(kind, kindMeta.categories, axisLabel)
    : `<div class="pct-caption">Per-record search data isn't loaded for this lane, so a
        lane-wide category breakdown isn't available here — see the individual book
        pages for record-level category filtering instead.</div>`;
  const schoolSection = kind === "spell"
    ? (() => {
        const sj = kindMeta.school_join || {};
        const cov = sj.coverage_pct != null ? `${sj.coverage_pct}%` : "n/a";
        const laneSpellCount = Object.values(kindMeta.categories || {})
          .reduce((a, c) => a + DONENESS_ORDER.reduce((s, v) => s + (c[v] || 0), 0), 0);
        // Round 23 QA finding 2: the School section's own record-count
        // caption (rendered by categoryBreakdownHtml below, from
        // school_categories' bucket totals) reads MORE than the lane's true
        // spell count above -- arithmetically correct (round 22's fix
        // credits a multi-school spell toward every school it names, per
        // `multi_school_extra_credits`), but shown with no explanation it
        // looks like the lane gained spells just by switching axes. Spell
        // out the honest reason inline, right where a reader would notice
        // the mismatch.
        const extraCredits = sj.multi_school_extra_credits || 0;
        const schoolTotal = laneSpellCount + extraCredits;
        // Round 24 QA finding 5: the previous wording ("3 more than the
        // lane's 2,843 spells above...") never stated the actual total
        // (2,846) the reader is looking at below, forcing an inference, and
        // "3 more" had no explicit subject. State the total explicitly.
        const multiNote = extraCredits > 0
          ? ` The school totals below add up to <strong>${num(schoolTotal)}</strong> —
              ${num(extraCredits)} more than the lane's ${num(laneSpellCount)}
              spells above — because ${num(sj.multi_school_spell_count || extraCredits)} spell${(sj.multi_school_spell_count || extraCredits) === 1 ? "" : "s"}
              belong${(sj.multi_school_spell_count || extraCredits) === 1 ? "s" : ""} to more than one school and
              ${(sj.multi_school_spell_count || extraCredits) === 1 ? "is" : "are"} counted once per school below —
              nothing was added to the corpus.`
          : "";
        return `<div class="section-title" style="margin-top:1.2em">Spell school (separate from tradition above)</div>
          <div class="pct-caption">“Tradition” above (Arcane/Divine/Psychic) is who casts a spell.
            “School” here (Necromancy, Evocation, …) is what KIND of magic it is — a different axis,
            never merged with tradition. Extracted from the spell's own <code>SCHOOL:</code> field in
            the source corpus — coverage ${esc(cov)}
            (${sj.stats ? num(sj.stats.ok) : "0"} of ${num(laneSpellCount)} spells joined cleanly;
            the rest report school as literal <code>n/a</code>, never guessed).${multiNote}</div>
          ${categoryBreakdownHtml(kind, kindMeta.school_categories, "School")}`;
      })()
    : "";

  el("view").innerHTML = `
    <div class="section-title">${esc(label)} — by book</div>
    <div class="pct-caption">${esc(capability)} Click a book to see its individual
      ${esc(titleCase(kind))} records.</div>
    <div class="grid">${cards || `<div class="empty">No books have any ${esc(titleCase(kind))} records in this payload.</div>`}</div>
    <div class="section-title" style="margin-top:1.4em">${esc(axisLabel)} — whole lane, every book</div>
    ${categorySection}
    ${schoolSection}`;
}

/* The joint table itself, collapsed by default. This is the artifact that makes
   the ladder auditable: a reader who distrusts a rung can see exactly which
   (wiring_class, status) cells fed it. Rendered from `cross_tab`, whose keys are
   "<wiring_class>|<status>" -- corpus-wide across every kind, not split by kind.
   `donenessOf()` is therefore called here with no `kind` argument on purpose: a
   `display|ingested-magnitude` or `computed|ingested-magnitude` cell mixes
   probeless-kind (`spell`/`companion`) records, which the ladder now reports as
   `held`, with other kinds' records that are genuinely `in-progress` -- one
   colour cannot be exactly right for a mixed cell, so this table keeps the
   coarser, kind-agnostic verdict rather than guessing which sub-population
   dominates. `by_doneness_kind` (rendered per-kind in renderByLane() and the
   per-record rows in renderUnitRows(), both of which DO pass `kind`) is the
   accurate source for any kind-specific question. */
function renderCrossTab(wi) {
  const ct = wi.cross_tab || {};
  if (!Object.keys(ct).length) return "";
  const cells = {};
  let grand = 0;
  Object.keys(ct).forEach((k) => {
    const [wc, st] = k.split("|");
    cells[wc] = cells[wc] || {};
    cells[wc][st] = ct[k];
    grand += ct[k];
  });
  // Same guard renderByLane() applies to `kind`: a status or wiring_class the
  // payload has that isn't in our known order arrays still renders, appended
  // at the end, rather than being silently dropped from the table (round 9,
  // SD-29 QA, latent-not-live per QA's own check — all 5 wiring classes and 7
  // statuses are present in both order arrays today).
  const presentStatuses = new Set();
  const presentWiring = new Set();
  Object.keys(cells).forEach((wc) => {
    presentWiring.add(wc);
    Object.keys(cells[wc] || {}).forEach((st) => presentStatuses.add(st));
  });
  const statuses = STATUS_ORDER.filter((st) => presentStatuses.has(st))
    .concat([...presentStatuses].filter((st) => !STATUS_ORDER.includes(st)));
  const wiringClasses = WIRING_CLASS_ORDER.filter((wc) => presentWiring.has(wc))
    .concat([...presentWiring].filter((wc) => !WIRING_CLASS_ORDER.includes(wc)));
  const head = `<tr><th></th>${statuses.map((st) =>
    `<th style="text-align:right;font-weight:normal;color:var(--muted)">${esc(st)}</th>`).join("")}</tr>`;
  const rows = wiringClasses.filter((wc) => cells[wc]).map((wc) => {
    const tds = statuses.map((st) => {
      const n = (cells[wc] || {})[st];
      if (!n) return `<td style="text-align:right;color:var(--muted)">·</td>`;
      const v = donenessOf(wc, st);
      return `<td style="text-align:right" title="${esc(wc)} + ${esc(st)} → ${esc(DONENESS_LABEL[v] || "?")}">` +
             `<span style="border-bottom:2px solid ${DONENESS_COLOR[v] || "transparent"}">${num(n)}</span></td>`;
    }).join("");
    return `<tr><th style="text-align:left;font-weight:normal">${esc(WIRING_CLASS_LABEL[wc] || wc)}` +
           ` <code style="color:var(--muted)">${esc(wc)}</code></th>${tds}</tr>`;
  }).join("");
  return `
    <details style="margin-top:0.5em">
      <summary style="cursor:pointer;color:var(--muted)">
        status × wiring_class — the ${num(grand)}-unit table both bars are margins of
      </summary>
      <div style="overflow-x:auto">
        <table class="mono" style="border-collapse:collapse;font-size:0.85em;margin-top:0.4em">
          ${head}${rows}
        </table>
      </div>
      <div class="pct-caption">
        Cell colours here are <strong>kind-agnostic</strong> — computed from wiring class
        &times; status alone, without knowing which kind's probe-availability applies to a
        given cell. A cell can mix several kinds, so no single colour could be correct
        per-kind.${wi.spell_kind_capped_count ? `
        For the ${num(wi.spell_kind_capped_count)} <code>spell</code> records in the
        <code>computed</code>&#43;<code>ingested-magnitude</code>,
        <code>computed</code>&#43;<code>text-complete</code>, and
        <code>display</code>&#43;<code>ingested-magnitude</code> cells, that means the
        colour shown is <strong>in-progress</strong> here but those records actually
        resolve to <strong>held</strong> once kind is taken into account — see the
        per-lane cards above for the kind-accurate ladder. (<code>display</code>&#43;<code>text-complete</code>
        is unaffected: that is <code>display</code>'s own completion bar, not the
        kind-capping logic.)` : `
        No kind currently disagrees between this cell-level colour and its own
        kind-capped verdict (<code>NO_GROUNDING_PROBE</code> is empty as of
        SD30-E0-F2, 2026-08-14 — see the per-lane cards above if that changes).`}
        Whole corpus, every book — the ladder above is in-scope
        books only, so these do not sum to it either way. (Count shipped by the producer
        from <code>cross_tab_by_kind</code>, not hand-typed — see
        <code>spell_kind_capped_count</code> in <code>work_inventory</code>.)
      </div>
    </details>`;
}

/* Mirrors the producer's doneness_verdict() so a cell can be coloured client
   side. Deliberately duplicated rather than shipped per cell: if the two ever
   disagree, the producer's rollup is authoritative and this table is what looks
   wrong, which is the failure direction that gets noticed. Returns "" for a pair
   neither side has a rule for, and colours nothing. */
function donenessOf(wc, st, kind) {
  const verdict = donenessOfUncapped(wc, st);
  // Round 8 fix (SD-29 QA finding, 2026-08-12): "in-progress" claims the bar
  // is "reachable with an instrument that exists" -- false for any `kind`
  // with no consumer-delta probe at all (see NO_GROUNDING_PROBE above).
  // Mirrors doneness_verdict()'s kind-capping in the producer; `kind` is
  // optional so every existing caller that has no kind in hand (e.g. the
  // corpus-wide cross-tab, which mixes kinds per cell) keeps its old,
  // uncapped behaviour rather than being silently miscoloured by a kind it
  // never had.
  if (verdict === "in-progress" && kind != null && NO_GROUNDING_PROBE.includes(kind)) {
    return "held";
  }
  return verdict;
}

function donenessOfUncapped(wc, st) {
  if (st === "deferred-with-reason") return "deferred";
  if (st === "engine-does-not-hold" || st === "not-started") return "not-started";
  if (st === "unknown") return "unmeasurable";
  // Mirrors doneness_verdict() in the producer (round 5 fix, SD-29 QA finding
  // #1, 2026-08-12): a `grounded`/`text-complete`/`ingested-magnitude` status
  // under an `ambiguous` wiring_class is real evidence -- it does not become
  // false because the wiring classifier separately failed, so it is never
  // discarded into "unmeasurable". But it also cannot be credited with MORE
  // confidence than an unresolved classification can guarantee: an
  // `ambiguous` record could resolve to `static`/`derived`, which caps at
  // `held` even for `grounded` (see that branch below). Round 4 routed
  // `ambiguous`+`grounded` to "done" on the theory that `grounded` clears
  // every bar -- refuted by this file's own `static`/`derived` branch, which
  // proves it doesn't. Round 5 applies the lower-bound rule used everywhere
  // else in this function (unknown never beats the worst case it could be):
  // every evidence-bearing status under `ambiguous` lands in "held".
  if (wc === "ambiguous") {
    return (st === "grounded" || st === "text-complete" || st === "ingested-magnitude") ? "held" : "";
  }
  // `display` (round 7 fix, SD-29 QA, 2026-08-12): `text-complete` is
  // display's actual bar. `grounded` and `ingested-magnitude` are both
  // disagreement signals, but not the SAME one. `ingested-magnitude` means
  // the consumer-delta probe has not been run yet -- an instrument that
  // exists and is reachable, so it is genuinely "in-progress". `grounded`
  // means the probe WAS run and produced evidence that contradicts the
  // `display` classification -- the same "needs a working classifier before
  // the bar is even known" situation `ambiguous` is in (see above), so it
  // gets the same verdict: "held", not "in-progress" (round 6 put both here,
  // which broke the `ambiguous` floor below) and not "done" (round 5).
  if (wc === "display") {
    return st === "text-complete" ? "done" : st === "grounded" ? "held" : "in-progress";
  }
  if (wc === "static" || wc === "derived") {
    return (st === "ingested-magnitude" || st === "grounded" || st === "text-complete") ? "held" : "";
  }
  if (wc === "computed") return st === "grounded" ? "done" : "in-progress";
  return "";
}

/* wiring_class is orthogonal to status: it says WHAT KIND of evidence a unit
   needs (display/static/derived/computed), with `ambiguous` for units the
   determinator could not classify. It never feeds `proven` above -- a unit's
   wiring_class does not move it between the bars in the status legend.
   `ambiguous` never reaches `done` (round 5 fix, SD-29 QA finding #1,
   2026-08-12): an unresolved classification is capped at what the
   `static`/`derived` fidelity bar would allow for the same status, so it
   can only cost credit, never gain it -- `static`/`derived`, a resolution
   `ambiguous` cannot rule out, caps even `grounded` evidence at `held`. So
   every evidence-bearing status under `ambiguous`
   (`grounded`/`text-complete`/`ingested-magnitude`) lands in `held` --
   visible on the ladder and counted in the usable denominator, but never in
   the "done" numerator -- rather than being discarded into `unmeasurable`.
   Per GE-09 it must render even when a book/corpus has zero of it, not be
   dropped silently. */
function renderWiringClassBlock(wi, total) {
  if (!wi.wiring_class_available) {
    return `<div class="pct-caption">${esc(wi.wiring_class_note ||
      "wiring_class summary unavailable — not the same as zero.")}</div>`;
  }
  const byWiring = wi.by_wiring_class || {};
  return `
    <div class="completion" style="margin-top:0.5em">
      ${wiringMiniBar(byWiring, total)}
    </div>
    <div class="pct-caption">
      <strong>Proof each unit needs</strong> — what finishing it would take, which is a
      different question from how far along it is. Crossed with the evidence bar above,
      this is what produces a kind-agnostic approximation of the doneness ladder — the
      real, kind-aware ladder lives in the per-lane cards above.
      <code>ambiguous</code> means
      determination itself failed: an undone work item, never folded into a "done"
      bucket or into <code>unknown</code>.
    </div>
    <div class="legend">${wiringLegend(byWiring)}</div>`;
}

function renderFreshness() {
  const t = DATA && DATA.generated_at;
  if (!t) return "";
  const age = Math.round((Date.now() - new Date(t).getTime()) / 60000);
  const stale = age > 20;
  return `<span class="freshness ${stale ? "stale" : ""}" title="${esc(t)}">payload ${age} min old${stale ? " — producer may be wedged" : ""}</span>`;
}

/* ======================= routing ======================= */

const ROUTES = [
  { re: /^\/?$/,                 view: viewLanding,   crumb: () => [] },
  { re: /^\/corpus$/,            view: viewCorpus,    crumb: () => [["Corpus", "#/corpus"]] },
  // Round 20: level 2 (one lane, every book). "Corpus" stays the level-1
  // parent crumb — #/lane/<kind> is one click below the lane cards on
  // #/corpus and renderByLane, same as before, just with a named stop now
  // that a page exists there instead of jumping straight to level 3.
  { re: /^\/lane\/([\w-]+)$/,    view: viewLane,      crumb: (m) => [["Corpus", "#/corpus"], [LANE_LABEL[m[1]] || titleCase(m[1]), null]] },
  // Round 20: #/kind/<kind>?book=<id> is level 3, reached either directly
  // (unfiltered, corpus-wide search — crumb stops at the lane) or via a
  // book click from #/lane/<kind> or a book's own page (crumb adds the book
  // as its own link, back to #/lane/<kind> in between — Corpus > Lane > Book,
  // per the brief's required breadcrumb shape). DATA may not be loaded yet
  // on the very first paint, so bookTitleFor's DATA.books lookup falls back
  // to a title-cased id, same as everywhere else this file guards that race.
  //
  // Round 21 fixed the <select>/table for an unrecognized `?book=` id
  // (viewUnits() clears unitState.book when the id isn't one of the
  // shard's own book values). Round 22 QA finding 4: the breadcrumb was a
  // SEPARATE code path that built straight off the raw, unvalidated `m[2]`
  // route-match via bookTitleFor() — which always returns SOMETHING
  // (falling back to a title-cased version of the bogus id), so a typo'd
  // book id produced a confident-looking FAKE book name in the crumb even
  // while the select/table correctly showed the unfiltered, all-books view.
  // Now routes through isKnownBookId() first, same "unrecognized == no
  // filter" rule the select/table already apply, so all three surfaces
  // agree.
  //
  // Round 23 QA finding 1: round 22's isKnownBookId() fix validated against
  // the wrong SET (the curated DATA.books list, not the shard's real book
  // ids), which just moved the disagreement rather than closing it -- see
  // isKnownBookId() above for the actual fix. `m[1]` (the kind) is passed
  // through here so the check is scoped to books that are real for THIS
  // kind specifically, matching viewLane()'s per-book cards exactly.
  { re: /^\/kind\/([\w-]+)(?:\?book=([\w-]+))?$/, view: viewUnits, crumb: (m) => (m[2] && isKnownBookId(m[2], m[1]))
      ? [["Corpus", "#/corpus"], [LANE_LABEL[m[1]] || titleCase(m[1]), `#/lane/${m[1]}`],
         [bookTitleFor(m[2]), null]]
      : [["Corpus", "#/corpus"], [LANE_LABEL[m[1]] || titleCase(m[1]), `#/lane/${m[1]}`], ["All books", null]] },
  { re: /^\/books$/,             view: viewBooks,     crumb: () => [["Books", "#/books"]] },
  { re: /^\/book\/([\w-]+)$/,    view: viewBook,      crumb: (m) => [["Books", "#/books"], [bookTitleFor(m[1]), null]] },
  { re: /^\/classes$/,           view: viewClasses,   crumb: () => [["Classes", "#/classes"]] },
  { re: /^\/races$/,             view: viewRaces,     crumb: () => [["Races", "#/races"]] },
  { re: /^\/decisions$/,         view: viewDecisions, crumb: () => [["Decisions", "#/decisions"]] },
];

function currentRoute() {
  const h = (location.hash || "#/").slice(1);
  for (const r of ROUTES) {
    const m = h.match(r.re);
    if (m) return { r, m };
  }
  // Round 22 QA finding 6 (documentation only, no behavior change): an
  // empty/malformed `#/lane/` hash (no kind segment, so it fails every
  // ROUTES regex above) falls through to here and lands on Overview
  // (ROUTES[0]) rather than a dedicated "bad lane" error page. Judged sound
  // by QA: content and chrome agree (both genuinely show Overview), only
  // the URL bar itself still reads "#/lane/" -- and that URL shape is not
  // reachable via any in-page click, only by hand-editing/truncating the
  // hash. Left as-is on purpose; this comment exists so a future round
  // doesn't rediscover and re-litigate the same non-decision.
  return { r: ROUTES[0], m: [] };
}

function renderCrumbs(route) {
  const parts = route.r.crumb(route.m);
  const bits = [`<a href="#/">Overview</a>`];
  parts.forEach(([label, href], i) => {
    bits.push(`<span class="sep">/</span>`);
    bits.push(href && i < parts.length - 1
      ? `<a href="${href}">${esc(label)}</a>`
      : `<span class="here">${esc(label)}</span>`);
  });
  el("crumbs").innerHTML = bits.join(" ") + `<span style="margin-left:auto">${renderFreshness()}</span>`;
}

// Round 21 QA finding 6: the level-1 lane grid (renderByLane, inside the
// persistent "completion" header) is on screen at every level but never
// got a "this one is selected" treatment when a reader is inside that
// lane's level-2/level-3 pages -- it only ran once at boot and on payload
// refresh, never from route(). A full renderCompletion() re-render on
// every hash change would also blow away the "N/N" completion header
// unnecessarily, so this is the lighter pass the finding allows: just
// toggle a class on whichever lane card (if any) matches the current
// route's kind. `data-kind` is stamped on each card by renderByLane().
function updateLaneSelection(activeKind) {
  const node = el("completion");
  if (!node) return;
  node.querySelectorAll(".card[data-kind]").forEach((card) => {
    card.classList.toggle("selected-lane", !!activeKind && card.dataset.kind === activeKind);
  });
}

function route() {
  if (!DATA) return;
  const cur = currentRoute();
  renderCrumbs(cur);
  const hashPath = (location.hash || "#/").slice(1);
  const laneOrKindMatch = hashPath.match(/^\/(?:lane|kind)\/([\w-]+)/);
  updateLaneSelection(laneOrKindMatch ? laneOrKindMatch[1] : null);
  try {
    cur.r.view(cur.m);
  } catch (e) {
    el("view").innerHTML = `<div class="banner err">View failed to render: ${esc(e.message)}</div>`;
    console.error(e);
  }
  return cur;
}

// Round 27 fix (operator report: "when I click a panel, nothing happens").
// route() always rendered the right content into #view -- confirmed by a
// stubbed-DOM click-path simulation across every route before this round --
// the operator just never SAW it: #view sits below the sticky .header in the
// document, and nothing anywhere in this file ever moved the viewport, so a
// click into a lane/book/kind card correctly re-rendered #view while the
// still-full-height header kept it entirely below the fold.
//
// This wrapper is the fix for that: on a genuine navigation (a hash change,
// which covers both a card's onclick="location.hash=...' and back/forward/
// typed-URL navigation) it scrolls the crumbs bar -- and #view right below
// it -- to the top of the viewport, so newly routed content is where the
// reader is actually looking. It must NOT run on the ~60s refresh tick's
// call to route() (see main(), below): that call exists to keep an
// operator's current page up to date with fresh data, not to move their
// scroll position out from under them mid-read. So this wrapper is wired
// ONLY to the "hashchange" listener; main()'s boot call and the refresh
// tick's conditional call both invoke the bare route() above directly and
// never reach this function.
//
// Target element: #crumbs, not #view. Once the header shrinks (see
// renderCompletion()/OVERVIEW_COMPLETION_HTML above), #crumbs is the first
// thing below the sticky header showing where navigation landed (the
// breadcrumb trail), with #view's content immediately below it in normal
// flow -- scrolling #crumbs to the viewport top brings both the "where am I"
// context and the new content into view together, rather than #view alone
// (which would show new content with no breadcrumb visible above it).
function routeAndScroll() {
  const isLanding = (location.hash || "#/").replace(/^#/, "") === "" ||
    (location.hash || "#/").replace(/^#/, "") === "/";
  route();
  if (isLanding) return; // landing/overview: nothing to scroll to, already at the top
  const target = el("crumbs");
  if (target && typeof target.scrollIntoView === "function") {
    target.scrollIntoView({ block: "start", behavior: "smooth" });
  }
}

/* ======================= views ======================= */

function card(href, title, sub, bodyHtml) {
  return `<div class="card" onclick="location.hash='${href}'">
    <h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div>${bodyHtml || ""}</div>`;
}

/* Raw status mini-bar. Tooltip leads with the plain-English label
   (STATUS_LABEL) and keeps the technical word alongside it in parentheses,
   rather than as the only text. As of round 2 (SD-29 QA finding #11,
   2026-08-12) this is used ONLY inside "For engineers" disclosures, where the
   raw word is the point -- #/corpus and #/kind/* were reachable from ordinary
   navigation and are no longer a vocabulary carve-out (see viewCorpus and
   renderUnitsShell), so they use donenessBarHtml/plain labels like every
   other slice now. */
function miniBar(byStatus, total) {
  if (!total) return "";
  const segs = STATUS_ORDER.filter((s) => byStatus[s])
    .map((s) => `<span title="${esc(STATUS_LABEL[s] || s)} (${esc(s)}): ${num(byStatus[s])}" style="width:${(byStatus[s] / total) * 100}%;background:${STATUS_COLOR[s]}"></span>`)
    .join("");
  return `<div class="bar" style="height:7px">${segs}</div>`;
}

// `scope` is required-in-practice, not optional: SD-29 QA finding #12 (round
// 2, 2026-08-12) flagged four unlabeled, differently-scoped "how done" figures
// crowding the landing page with no way to tell they weren't the same claim.
// Every card built off this helper now states its own scope inline so it
// reads as "this card's own narrower thing", not a competitor to the ONE
// headline figure at the very top of every page (the in-scope doneness
// percentage in the persistent header, built by renderDonenessBlock).
//
// `noun` replaces the old hardcoded "proven" (round 3, SD-29 QA finding #20,
// 2026-08-12): `metric()` had no idea what its caller was actually counting,
// and two of its three call sites (Classes, Races) are not `proven`/status
// data at all -- they're `DATA.matrix.*.state === "full"` counts, a
// completely different measure that "proven" was silently mislabeling.
// Callers now say what they're counting in plain words.
function metric(n, of, noun, scope) {
  return `<div class="metric"><span class="n">${pctCell(n, of)}</span>
          <span class="of">${num(n)} / ${num(of)} ${esc(noun)}${scope ? ` — ${esc(scope)}` : ""}</span></div>`;
}

/* wiring_class mini bar (GE-09). Same shape as miniBar() above but keyed off
   WIRING_CLASS_ORDER/COLOR, and it always renders the "ambiguous" segment
   even at width 0-and-present (i.e. the key exists with value 0) so an
   emptied-out ambiguous bucket is still visible in the legend, not just the
   bar -- see wiringLegend(). */
function wiringMiniBar(byWiring, total) {
  if (!total) return "";
  const segs = WIRING_CLASS_ORDER.filter((c) => byWiring[c])
    .map((c) => `<span title="${esc(c)}: ${num(byWiring[c])}" style="width:${(byWiring[c] / total) * 100}%;background:${WIRING_CLASS_COLOR[c]}"></span>`)
    .join("");
  return `<div class="bar" style="height:7px">${segs}</div>`;
}

function wiringLegend(byWiring) {
  /* Plain phrasing first, the determinator's own word after it in code style --
     the technical name stays on screen so a bar can be tied back to
     wiring-class-determination.md, it just stops being the only thing there. */
  return WIRING_CLASS_ORDER.map((c) =>
    `<span class="chip" title="${esc(c)}: ${num(byWiring[c] || 0)}">` +
    `<span class="sw" style="background:${WIRING_CLASS_COLOR[c]}"></span>` +
    `${esc(WIRING_CLASS_LABEL[c] || c)} <code>${esc(c)}</code> ${num(byWiring[c] || 0)}</span>`).join("");
}

function viewLanding() {
  const wi = DATA.work_inventory || {};
  const idx = DATA.unit_index || {};
  const cards = [];

  if (wi.available) {
    const kinds = Object.keys(idx.kinds || {}).length;
    // No percentage on this card (round 3, SD-29 QA finding #19, 2026-08-12):
    // round 2 put a corpus-wide "fully usable" % here that coincidentally
    // rounded to the same 8.5% as the Books card below while measuring a
    // genuinely different thing — two numbers landing on the same digits by
    // chance is actively confusing, not just cluttered. The ONE headline
    // "how usable is this corpus" number lives in the persistent header at
    // the top of every page (in-scope, unmeasurable-and-deferred-excluded);
    // this card is pure navigation into the searchable record browser, where
    // each content type shows its own scoped, capability-sentence-qualified
    // percentage (see viewCorpus / LANE_CAPABILITY).
    cards.push(card("#/corpus", "Search everything",
      `${num(wi.total_units)} records across ${kinds || Object.keys(wi.by_kind || {}).length} content types — every book, searchable by name`,
      ""));
  }

  // Round 4 fix (SD-29 QA finding F25, 2026-08-12): this card used to show
  // `bProven` — a straight PROVEN_STATUSES sum, i.e. the raw status axis —
  // under the label "confirmed working", which is a doneness-shaped claim
  // built from a number that carries no doneness information at all (it read
  // 565 higher than the corpus's real `done` count). Route through the real
  // doneness ladder instead, same as every other "fully usable" figure on
  // this page.
  const books = DATA.books || [];
  const invBooks = (wi.books || []);
  const bTotal = invBooks.reduce((a, b) => a + (b.units || 0), 0);
  const bDoneness = aggDoneness(invBooks);
  const bDone = bDoneness["done"] || 0;
  const bDenom = usableDenom(bDoneness, bTotal);
  cards.push(card("#/books", "Books",
    `${books.length} curated · ${invBooks.length} in inventory`,
    bTotal ? metric(bDone, bDenom, "fully usable", "by book, whole-corpus record count") : `<span class="na">n/a</span>`));

  // Label the channel split. "7 of 37 races" reads as 19% done when in fact
  // every race in the active channel is complete and the other 30 belong to a
  // channel nobody has started.
  const chanSplit = (rows) => {
    const byCh = {};
    rows.forEach((r) => { byCh[r.channel || "(none)"] = (byCh[r.channel || "(none)"] || 0) + 1; });
    return Object.keys(byCh).sort().map((c) => `${c} ${byCh[c]}`).join(" · ");
  };

  const cls = (DATA.matrix && DATA.matrix.classes) || [];
  const clsFull = cls.filter((c) => c.state === "full").length;
  cards.push(card("#/classes", "Classes",
    chanSplit(cls), metric(clsFull, cls.length, "playable at every level", "this class roster")));

  const races = (DATA.matrix && DATA.matrix.races) || [];
  const rFull = races.filter((r) => r.state === "full").length;
  cards.push(card("#/races", "Races",
    chanSplit(races), metric(rFull, races.length, "playable at every level", "this race roster")));

  const dec = ((DATA.channels || {})["v0.6"] || {}).decisions || {};
  const open = (dec.open || []).length;
  cards.push(card("#/decisions", "Decisions",
    `${open} open · ${(dec.resolved || []).length} resolved`,
    `<div class="metric"><span class="n">${open}</span><span class="of">awaiting a call</span></div>`));

  let html = "";

  // Disagreements between sources go at the top. Rendering a stale manifest
  // beside the engine's answer without comment is how this dashboard lost
  // the operator's trust.
  const issues = dataQualityIssues();
  if (issues.length) {
    // Round 25 QA finding 5: this banner is the primary, always-visible
    // top-of-page surface (not tucked behind any disclosure), so it must not
    // leak raw engineering vocabulary (CLI invocations, repo file paths,
    // "proven"/"unit" jargon) into its always-shown text -- every other
    // place in this file that shows content like this puts the plain-
    // language version up front and the raw detail behind a "For engineers"
    // <details> disclosure (see e.g. viewBook()'s status/wiring_class mix
    // above). Two layers here too: a jargon-free summary in the banner
    // itself, and the exact figures/sources behind the same convention.
    html += `<div class="banner warn"><strong>Some numbers here may be out of date</strong>` +
      `<ul style="margin:0.4em 0 0 1.1em;padding:0">` +
      issues.map((i) => `<li style="margin-bottom:0.3em">${esc(i.summary)}</li>`).join("") +
      `</ul>
      <details style="margin-top:0.6em">
        <summary style="cursor:pointer;color:var(--muted);font-size:0.82em">For engineers — exact figures and sources</summary>
        <ul style="margin:0.4em 0 0 1.1em;padding:0">` +
        issues.map((i) => `<li style="margin-bottom:0.3em">${i.detail}</li>`).join("") +
        `</ul>
      </details>
    </div>`;
  }

  // Round 27 fix: this is the doneness ladder, full per-lane card grid, and
  // "for engineers" disclosures that used to live inside the sticky
  // `.header` (see the comment on renderCompletion()/OVERVIEW_COMPLETION_HTML
  // above) -- real page CONTENT, not persistent chrome, so it belongs on the
  // one view a reader lands on to get the whole picture, not stuck to every
  // page's top. The sticky header keeps only the headline % and a compact
  // one-line-per-lane strip; this is where the full detail behind both now
  // lives.
  html += OVERVIEW_COMPLETION_HTML;

  /* Delivered content — a SIZE, not a completion claim (round 3, SD-29 QA
     finding #19, 2026-08-12). Round 2 called this "the primary 'how usable
     is this' figure", which put two different things on screen calling
     themselves primary: this table (no denominator, so it cannot even BE a
     percentage) and the header's doneness ladder above the fold on every
     page (an actual in-scope percentage, unmeasurable-and-deferred
     excluded). Only one figure gets to be the headline; that's the header.
     This table answers a different, narrower question -- "how much of the
     corpus has the engine loaded in and carried end-to-end to a character
     sheet" -- and says so plainly rather than competing for the same claim.
     Counted off the engine's own compiled tables by v06_content_state_dump. */
  const cs = DATA.content_state || {};
  if (cs.available && (cs.books || []).length) {
    const totalRecs = cs.books.reduce(
      (a, b) => a + Object.values(b.kinds || {}).reduce((x, y) => x + y, 0), 0);
    html += `<div class="section-title">Delivered content — ${num(totalRecs)} records
      across ${cs.books.length} books, engine-verified</div>
      <div class="result-note">This is a corpus-size count, not a completion percentage —
      it has no denominator because every one of these ${num(totalRecs)} records is
      already loaded into the engine and carried through to a player-facing character
      sheet, verified by actually building the character end to end rather than trusting
      a row count. Counted off the engine's compiled tables
      (<code>${esc(cs.generated_by || "v06_content_state_dump")}</code>). For "how usable
      is this corpus" as a percentage, see the figure at the very top of this page —
      that is the one headline number; everything below answers its own narrower,
      differently-scoped question (see each section's own label).</div>
      <div class="table-wrap"><table>
      <thead><tr><th>Book</th><th class="num">Records</th><th>Breakdown</th></tr></thead><tbody>` +
      cs.books.map((b) => {
        const kinds = b.kinds || {};
        const n = Object.values(kinds).reduce((x, y) => x + y, 0);
        const detail = Object.keys(kinds).filter((k) => kinds[k])
          .map((k) => `${esc(k)} <strong>${num(kinds[k])}</strong>`).join(" · ");
        return `<tr><td>${esc(titleCase(b.id))}</td>
          <td class="num"><strong>${num(n)}</strong></td>
          <td style="color:var(--muted)">${detail || "—"}</td></tr>`;
      }).join("") + `</tbody></table></div>`;
  }

  html += `<div class="section-title">Readiness by channel — checked automatically by the engine</div>`;
  const ready = channelReadiness();
  const wcMeta = {};
  (DATA.workchannels || []).forEach((c) => { wcMeta[c.id] = c; });
  const rCards = Object.keys(ready).sort().map((ch) => {
    const r = ready[ch];
    const done = r.classes[0] + r.races[0];
    const of = r.classes[1] + r.races[1];
    const meta = wcMeta[ch] || {};
    const complete = of > 0 && done === of;
    return `<div class="card flat">
      <h3>${esc(meta.label || ch)} ${complete ? '<span style="color:var(--full)">✓</span>' : ""}</h3>
      <div class="sub">${esc(meta.kind || "")}</div>
      <div class="metric"><span class="n" style="color:${complete ? "var(--full)" : "var(--fg)"}">${done}/${of}</span>
        <span class="of">playable at every level 1&ndash;20</span></div>
      <div class="sub" style="margin:0">
        ${r.classes[1] ? `classes ${r.classes[0]}/${r.classes[1]}` : ""}
        ${r.races[1] ? ` · races ${r.races[0]}/${r.races[1]}` : ""}
      </div></div>`;
  });
  html += `<div class="grid">${rCards.join("")}</div>`;

  html += `<div class="section-title">Where the work stands</div><div class="grid">${cards.join("")}</div>`;

  // Manifests are hand-maintained; say so on the tin.
  const mans = DATA.manifests || {};
  const mIds = Object.keys(mans).filter((k) => (mans[k].items || []).length);
  if (mIds.length) {
    html += `<div class="section-title">Manifests — hand-maintained, may lag the engine</div>
      <div class="table-wrap"><table>
      <thead><tr><th>Manifest</th><th>Scope</th><th class="num">Complete</th>
        <th class="num">Open</th><th>Managed by</th></tr></thead><tbody>` +
      mIds.map((k) => {
        const m = mans[k], s = m.stats || {};
        const open = (s.pending || 0) + (s.in_progress || 0);
        return `<tr>
          <td class="mono">${esc(k)}</td>
          <td style="max-width:34em;color:var(--muted);font-size:0.92em">${esc(m.scope || "")}</td>
          <td class="num">${s.complete || 0}</td>
          <td class="num" style="color:${open ? "var(--warn)" : "var(--muted)"}">${open}</td>
          <td>${esc(m.managed_by || "")}</td></tr>`;
      }).join("") + `</tbody></table></div>`;
  }
  el("view").innerHTML = html;
}

/* Round 2 (SD-29 QA finding #11, 2026-08-12): this page and #/kind/* are NOT
   an auditor-only carve-out — #/corpus is the first card on the ordinary
   landing page, reachable by normal navigation, and QA's other findings
   (#3 held-as-coverage, #6 the stale no-probe list, #9 duplicate chips) all
   lived on these pages. Decision: bring them up to the same plain-language
   standard as the three main slices rather than gating them behind a
   disclosure — a search tool a reader can reach with one click needs to be
   readable without one, the same as everything else on the page. */
function viewCorpus() {
  const idx = DATA.unit_index || {};
  const wi = DATA.work_inventory || {};
  if (!idx.available) {
    el("view").innerHTML = `<div class="banner warn">${esc(idx.note ||
      "Per-record search isn't available right now, so this page can't list content types.")}</div>` +
      corpusFallbackTable(wi);
    return;
  }
  const kinds = idx.kinds || {};
  const byKind = wi.by_doneness_kind || {};
  // Round 3 (SD-29 QA finding #18, 2026-08-12): this page had neither the
  // per-kind capability sentence (LANE_CAPABILITY, otherwise only shown in
  // renderByLane) nor the probeless caveat (NO_GROUNDING_PROBE, otherwise
  // only shown in renderUnitsShell) -- so a reader landing here saw e.g.
  // spell at 0.1% with no explanation, and equipment/feat's inflated-looking
  // percentages with no hedge, even though both explanations already existed
  // elsewhere on the site. Bring both treatments here too, same as every
  // other place a per-kind "done" figure is shown.
  const cards = Object.keys(kinds).sort((a, b) => kinds[b].units - kinds[a].units).map((k) => {
    const m = kinds[k];
    const by = byKind[k] || {};
    // Round 4 fix (SD-29 QA finding F33, 2026-08-12): the numerator here
    // comes from `wi.by_doneness_kind[k]` and the denominator from
    // `DATA.unit_index.kinds[k]` — two different sources this page never
    // checked against each other. Same pattern renderByLane already guards
    // with `wi.by_kind` as the independent margin; `m.units` (the unit_index
    // shard's own record count) is this page's equivalent independent
    // source, so cross-check the ladder against it the same way.
    if (typeof m.units === "number") {
      assertLadderSums(`corpus card: ${k}`, by, m.units);
    }
    const done = by["done"] || 0;
    const unmeasurable = by["unmeasurable"] || 0;
    const deferred = by["deferred"] || 0;
    const covDenom = usableDenom(by, m.units);
    const capability = LANE_CAPABILITY[k] ||
      `We don't yet have a written definition of "fully usable" for this content type.`;
    // Round 14 fix (finding #2, same bug on a 3rd surface): this caveat was
    // ungated here too, using the exact same wording/data as renderByLane's
    // pre-round-14 bug -- companion would have shown the "gap in the
    // checking tool" caveat here despite being 100% not-started with zero
    // evidence. Now shares probelessCaveat() with renderByLane so the two
    // can't drift apart again.
    const probelessNote = probelessCaveat(k, by);
    // Round 14 fix (finding #3): this card stated the checkable denominator
    // (covDenom) but never showed the excluded count/reason bridging it to
    // `m.units`, unlike the other three "fully usable" surfaces. Wired
    // through the same excludedClause() helper for consistency.
    // Round 21 QA finding 7: this used to link straight to `#/kind/${k}`
    // (level 3, corpus-wide/unfiltered search), bypassing the level-2
    // `#/lane/${k}` per-book breakdown entirely -- so a reader starting
    // from viewCorpus never saw the per-book drilldown that renderByLane's
    // cards on the landing page always route through. Both level-1
    // surfaces now share the same entry point; `#/kind/<kind>` is still
    // reachable one click further in, from any book panel on the lane page.
    return card(`#/lane/${k}`, titleCase(k), capability,
      `<div class="sub" style="margin-top:-0.3em">${num(m.units)} records — click to search</div>
       <div class="metric"><span class="n">${pctCell(done, covDenom)}</span>
       <span class="of">${num(done)} / ${num(covDenom)} fully usable${mechConfirmedSuffix(k, done, wi)}${excludedClause(unmeasurable, deferred)}</span></div>` +
      donenessBarHtml(by, m.units) + probelessNote);
  });
  el("view").innerHTML =
    `<div class="section-title">Search everything, by content type</div>
     <div class="pct-caption">Same "fully usable" measure as the rest of this page, scored
       against each content type's own definition below — click a content type to search
       its individual records by name.</div>
     <div class="grid">${cards.join("")}</div>`;
}

function corpusFallbackTable(wi) {
  const byKind = wi.by_kind || {};
  if (!Object.keys(byKind).length) return `<div class="empty">No content-type data in this payload.</div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Content type</th><th class="num">Records</th></tr></thead><tbody>` +
    Object.keys(byKind).sort((a, b) => byKind[b] - byKind[a])
      .map((k) => `<tr><td>${esc(titleCase(k))}</td><td class="num">${num(byKind[k])}</td></tr>`).join("") +
    `</tbody></table></div>`;
}

/* ---- the searchable unit layer ---- */

const UNIT_PAGE = 250;
let unitState = null;

function viewUnits(m) {
  const kind = m[1];
  // Round 12 fix (finding #3): a click from the per-book "how usable is each
  // content type" panel (renderBookKindCross) now carries the clicked book
  // through as `#/kind/<kind>?book=<id>` instead of always landing on the
  // corpus-wide figure with no explanation of the scope change. The book id
  // in that hash is the same id the producer uses in `by_doneness_book_kind`
  // and in every shard row's book column, so it can be applied directly as
  // the existing bookSel filter with no translation.
  const bookFilter = m[2] || "";
  el("view").innerHTML = `<div class="spinner">Loading ${esc(titleCase(kind))} records…</div>`;
  loadShard(kind).then((shard) => {
    // Round 21 QA finding 8: an unrecognized `?book=<id>` (typo, stale link,
    // hand-edited hash) used to be kept verbatim in unitState.book, which
    // produced self-contradicting chrome -- the book <select> shows no
    // selection (falls back to reading "All books" since the bogus id isn't
    // one of its <option>s), the table shows 0 rows, and the breadcrumb
    // title-cased the bogus id into a confident-looking fake book name. Fix:
    // validate against the book ids this shard's own rows actually carry
    // (the same set renderUnitsShell's <select> is built from) and treat an
    // unrecognized id as no filter at all, rather than keeping a broken
    // partial state — internally consistent chrome beats a technically-more-
    // literal URL echo.
    const realBooks = new Set(shard.rows.map((r) => r[shard.cols.book]));
    const validBookFilter = bookFilter && realBooks.has(bookFilter) ? bookFilter : "";
    // `category` (round 20): selected raw type_facet-first-segment ("" = all,
    // "none" = the uncategorised group). `categoryAxis` only matters for
    // spell, which is the one kind with two independent category axes
    // (tradition via type_facet, school via the SCHOOL: join) — every other
    // kind ignores it and always reads the shard's `type_facet` column.
    unitState = { kind, shard, q: "", statuses: new Set(), category: "", categoryAxis: "type_facet", book: validBookFilter, limit: UNIT_PAGE };
    renderUnitsShell();
    renderUnitRows();
  }).catch((e) => {
    el("view").innerHTML = `<div class="banner err">Could not load "${esc(kind)}" units: ${esc(e.message)}</div>`;
  });
}

// Round 16: pulled out of renderUnitsShell so it can be re-run standalone
// whenever unitState.book changes (initial load via ?book= on the URL, or a
// later in-page dropdown change) without tearing down/rebuilding the whole
// shard table, search box, and chip state underneath it.
function renderKindHeader() {
  const { kind, shard } = unitState;
  const meta = ((DATA.unit_index || {}).kinds || {})[kind] || {};

  // Doneness ladder for this kind, corpus-wide (same source and same
  // beginner_box exclusion as the "How usable is each kind of content?"
  // cards) rather than summing HELD_STATUSES into its own headline figure --
  // per SD-29 decisions.md §46.4, `held` must never be presented as THE
  // coverage number (QA finding #3, round 2, 2026-08-12: round 1's banner
  // literally told readers to "read held as the coverage figure here").
  // Round 16 fix (QA: round 15's shared-helper fix only worked on the
  // UNFILTERED page -- when a book filter is active, via #/kind/<kind>?book=
  // <id> (or the in-page book dropdown below), this ladder must be the
  // BOOK-SCOPED one, or the caveat/percentage both keep evaluating
  // corpus-wide evidence a reader never asked about. The book×kind panel
  // (renderBookKindCross) already reads this exact structure per-row; this
  // is the same lookup, just carried across the click-through. Falls back to
  // the corpus-wide ladder only when no book filter is set, matching round
  // 15's verified unfiltered behavior.
  const bookByKind = unitState.book
    ? (((DATA.work_inventory || {}).by_doneness_book_kind || {})[unitState.book] || {})
    : null;
  const doneBy = bookByKind
    ? (bookByKind[kind] || {})
    : (((DATA.work_inventory || {}).by_doneness_kind || {})[kind] || {});
  const done = doneBy["done"] || 0;
  // Round 17 fix (finding 2/3): the excluded-count clause (unmeasurable +
  // deferred) was shown everywhere else on the page (renderByLane, viewCorpus,
  // the book×kind panel, the book card) via excludedClause() but never here —
  // this header could show a bare percentage with no reconcilable denominator
  // (e.g. "2.3% fully usable" of 959 records when the true figure is 11/476).
  // `doneBy` is already book-scoped when a filter is active, so these reuse
  // the same source as `done` above with no new lookup.
  const unmeasurable = doneBy["unmeasurable"] || 0;
  const deferred = doneBy["deferred"] || 0;
  // When book-scoped, the denominator is this book+kind's own record count
  // (the ladder's own sum), not the corpus-wide `meta.units` -- summing
  // by_doneness_book_kind's rungs for one book+kind gives exactly that count,
  // the same total the book×kind panel and resultNote below independently
  // arrive at by filtering rows.
  const covDenom = bookByKind
    ? usableDenom(doneBy, DONENESS_ORDER.reduce((a, v) => a + (doneBy[v] || 0), 0))
    : usableDenom(doneBy, meta.units);
  // Round 15 fix (round 14 flagged but deliberately left this surface
  // unfixed pending scope confirmation): this page is reached by ordinary
  // click-through from renderByLane/viewCorpus, both fixed in round 14 --
  // now routed through the same shared probelessCaveat() helper so the
  // hasEvidence gate (and wording) can't drift between the surfaces again.
  // Round 16: now fed the book-scoped ladder above when a filter is active,
  // so it can't contradict the book×kind panel row the reader just clicked.
  const probelessNote = probelessCaveat(kind, doneBy);

  // Round 16: `mechanically_confirmed_by_kind` has no book-scoped
  // counterpart in the payload today (unlike by_doneness_book_kind), so this
  // suffix can only ever be corpus-wide. Showing a corpus-wide "N mechanically
  // confirmed" count stapled to a now-book-scoped percentage would itself be
  // the same book/corpus mismatch this round exists to remove (it could even
  // read as more than the book-scoped `done` total) -- suppressed under a
  // book filter until the producer ships a book-scoped version.
  // Round 17 fix (finding 3): suppressing the WHOLE pct-caption line under a
  // book filter (because the mechanically-confirmed sub-count has no
  // book-scoped counterpart) also silently dropped the plain "N fully usable"
  // statement that DOES have a book-scoped value, making a deliberate scope
  // narrowing read as a rendering glitch. Keep the line; swap only the
  // mechanically-confirmed parenthetical for a short note explaining why it's
  // absent under a book filter.
  // Round 18 fix (finding 5): nothing to explain when the book-scoped done
  // count is 0 -- there is no mechanically-confirmed detail to caveat, same
  // suppression rule the unfiltered path (mechConfirmedSuffix) already
  // applies at done === 0.
  const mechSuffix = bookByKind
    ? (done === 0 ? "" : " (mechanical-confirmation detail is corpus-wide only)")
    : mechConfirmedSuffix(kind, done, DATA.work_inventory || {});
  // F4 fix (round 5, SD-29 QA finding #4, 2026-08-12): a shard that has no
  // `wiring_class` COLUMN at all (an older/incompatible shard shape, not
  // just a row with a blank value) makes wcOf() silently default every row
  // to "ambiguous". Under the round-5 lower-bound rule that's no longer a
  // favorable misread (ambiguous+grounded is `held`, not `done`), but it is
  // still silent -- a reader has no way to know the "How usable" column is
  // running on a degraded, all-ambiguous classification for this whole
  // shard. Surface it instead of letting it pass unnoticed.
  const shardHasWiringClass = shard.cols.wiring_class != null;
  // Round 16: the "N records" count in this same sentence is the other half
  // of the header's claim -- leaving it corpus-wide while the percentage
  // next to it is now book-scoped would just relocate the finding-2
  // contradiction one clause to the left ("2,275 records, 85% fully usable"
  // reads as 85% of 2,275, not of the 144 this book actually has).
  const headerUnits = bookByKind
    ? DONENESS_ORDER.reduce((a, v) => a + (doneBy[v] || 0), 0)
    : meta.units;
  // Round 17 fix (finding 4): titleCase(unitState.book) produces "Feat in
  // Advanced Players Guide" while viewBook shows the real title "Advanced
  // Player's Guide" from DATA.books -- two different names for the same book
  // across an ordinary click-through. Fall back to the title-cased id only if
  // the book somehow isn't in DATA.books.
  // Round 18 fix (finding 2): direct id match misses books reached only via
  // INVENTORY_ID_ALIASES (bestiary_1 -> bestiary is the one real case) --
  // every other book-scoping surface (inventoryFor, viewBooks,
  // renderBookKindCross) already applies the alias, but this lookup goes the
  // OTHER direction (shard-side id -> curated book), so it needs to search
  // for the curated book whose id, once aliased, matches unitState.book.
  const bookTitle = bookByKind
    ? (((DATA.books || []).find((x) => (INVENTORY_ID_ALIASES[x.id] || x.id) === unitState.book) || {}).title || titleCase(unitState.book))
    : "";
  el("kindHeader").innerHTML = `
    <div class="section-title">${esc(titleCase(kind))}${bookByKind ? ` in ${esc(bookTitle)}` : ""} — ${num(headerUnits)} records,
      ${pctCell(done, covDenom)} fully usable</div>
    <div class="pct-caption" style="margin-top:-0.3em">${num(done)} fully usable${mechSuffix}${excludedClause(unmeasurable, deferred)}</div>
    ${!shardHasWiringClass ? `<div class="banner warn">
      <strong>This shard has no <code>wiring_class</code> field.</strong> Every record below
      is being treated as unclassified ("could not be classified") for the "How usable"
      column, which — under this dashboard's conservative rule — never shows better than
      "filed, but unconfirmed" even for records with the strongest evidence. This is a data
      shape gap, not a claim that these records are unfinished.</div>` : ""}
    ${probelessNote}`;
}

// Round 17 fix (finding 1): the status-filter chips used to be built once,
// inline in renderUnitsShell, from `meta.by_status` -- always corpus-wide,
// even after round 16 made the header above them book-scoped. That left the
// chips visibly contradicting their own header (e.g. occult_adventures/spell:
// header "473 records" atop chips summing to 2,843, the corpus-wide total),
// and clicking a chip whose count only exists corpus-wide could filter the
// book-scoped table to zero rows. Pulled out into its own function, keyed off
// unitState.book, so it can be rebuilt (like renderKindHeader() already is)
// whenever the book scope changes -- initial load with ?book= on the URL, or
// the in-page dropdown -- and stays in sync with the header and table.
function chipStatusCounts() {
  const { kind, shard, book } = unitState;
  if (!book) {
    const meta = ((DATA.unit_index || {}).kinds || {})[kind] || {};
    return meta.by_status || {};
  }
  // Book-scoped: count this book's own rows by raw status, ignoring the
  // current search text / status-chip selection (same convention as the
  // corpus-wide meta.by_status this replaces -- it was never affected by
  // those either, since chips need to show what's AVAILABLE to filter by,
  // not what's already been filtered down to).
  const ci = shard.cols;
  const by = {};
  shard.rows.forEach((r) => {
    if (r[ci.book] !== book) return;
    const st = r[ci.status] || "unknown";
    by[st] = (by[st] || 0) + 1;
  });
  return by;
}

function renderFilterChips() {
  const by = chipStatusCounts();
  // Merge chips that share a plain label rather than emitting one per raw
  // status word (SD-29 QA finding #9, round 2, 2026-08-12): STATUS_LABEL maps
  // both `engine-does-not-hold`/`not-started` to "not started", and round 1 still
  // emitted one chip per raw status regardless — two indistinguishable chips
  // with different counts and no way to tell them apart. Each merged chip's
  // filter toggles every raw status it represents together. Round 4 (SD-29 QA
  // finding F25, 2026-08-12): `grounded` and `text-complete` no longer share
  // a label — they were merged under "confirmed working" before, which is
  // exactly the bug this round exists to remove; they are different evidence
  // tiers (an observed effect vs. a complete written record) and now render
  // as two distinct, honestly-labeled chips.
  const groups = [];
  const groupByLabel = {};
  STATUS_ORDER.filter((s) => by[s]).forEach((s) => {
    const label = STATUS_LABEL[s] || s;
    if (!groupByLabel[label]) {
      groupByLabel[label] = { label, statuses: [], count: 0, color: STATUS_COLOR[s] };
      groups.push(groupByLabel[label]);
    }
    groupByLabel[label].statuses.push(s);
    groupByLabel[label].count += by[s];
  });
  el("filterChips").innerHTML = groups.map((g) => {
    const on = g.statuses.some((s) => unitState.statuses.has(s));
    return `<button class="fchip${on ? " on" : ""}" data-statuses="${esc(g.statuses.join(","))}">
       <span class="sw" style="background:${g.color}"></span>${esc(g.label)} ${num(g.count)}</button>`;
  }).join("");
  document.querySelectorAll(".fchip").forEach((b) => {
    b.addEventListener("click", () => {
      const group = b.dataset.statuses.split(",");
      const allOn = group.every((s) => unitState.statuses.has(s));
      if (allOn) { group.forEach((s) => unitState.statuses.delete(s)); b.classList.remove("on"); }
      else { group.forEach((s) => unitState.statuses.add(s)); b.classList.add("on"); }
      unitState.limit = UNIT_PAGE;
      renderUnitRows();
    });
  });
}

/* ---- level 3 sub-category filter/breakdown (round 20) ----
   Computed client-side from the already-loaded shard, not a new payload
   field: this page already holds the full per-kind shard in memory (lazy-
   loaded once via loadShard(), same shard level 2's lane-wide numbers come
   from on the producer side), so filtering/grouping it by `type_facet` (or,
   for spell, `school`) costs nothing extra to fetch and reconciles with the
   lane-wide numbers by construction — same partition of the same units, just
   summed client-side instead of server-side. */
// Round 22 QA finding 2 verification turned up an adjacent, previously-
// unnoticed gap: a leading `WORD:` field-token prefix (e.g.
// `TYPE:SummonerClassFeatures`) is stripped by the PRODUCER's category_of()
// (round 21 finding 1's `TYPE:Goods` fix), but this client-side function
// never mirrored that strip -- so a raw segment carrying the prefix used to
// silently mismatch the producer's key (falling back to an untranslated
// "Type Summoner Class Features" chip via humanizeCategoryFallback, its own
// small raw-vocabulary leak) instead of landing in the same
// "Summoner Class Features" bucket the producer already puts it in. Same
// `_FIELD_TOKEN_PREFIX_RE` pattern as the producer, applied here too.
const FIELD_TOKEN_PREFIX_RE = /^[A-Za-z][A-Za-z0-9]*:/;

function categoryOfRaw(tf) {
  if (!tf) return "none";
  const s = String(tf);
  const dot = s.indexOf(".");
  const seg = (dot === -1 ? s : s.slice(0, dot)).replace(FIELD_TOKEN_PREFIX_RE, "");
  return seg || "none";
}

// Round 22 QA finding 2: the raw `type_facet` data contains BOTH a
// CamelCase spelling and an already-space-separated spelling of the same
// category (e.g. `RangerClassFeatures` vs `Ranger Class Features`) --
// `categoryOfRaw()` alone returns these as two different strings, which
// used to become two chips/filter-groups with the SAME rendered label (via
// categoryLabelFor's humanizer) and different counts. This mirrors the
// producer's `category_group_key()` EXACTLY (same normalization, same
// algorithm) so the two spellings collapse into one grouping key here too
// -- the key this function returns is what gets matched against the
// producer's `meta.categories` map keys, so the two sides must stay in
// lockstep (SHARD_SCHEMA bumped 4 -> 5 the same round this landed).
// A full post-fix sweep (round 22 QA finding 2 verification) found one
// duplicate-label pair character-normalization alone doesn't catch:
// `SpecialQuality`/`SpecialQuaility` (the latter a verbatim typo, both
// resolving to the same "Special Qualities" label) differ by an actual
// letter, not just case/spacing. Small explicit alias table, mirrors the
// producer's `_CATEGORY_GROUP_KEY_ALIASES` exactly -- must stay in
// lockstep with it.
const CATEGORY_GROUP_KEY_ALIASES = {
  specialquaility: "specialquality",
  // Round 23 QA finding 3: mirrors the producer's `_CATEGORY_GROUP_KEY_
  // ALIASES` additions exactly -- must stay in lockstep with it. Only
  // matters for the client-side "raw fallback" path (humanizeCategoryFallback)
  // when a group has no server-shipped label, but kept in lockstep anyway
  // per this table's stated policy.
  genaral: "general",
  metasionic: "metapsionic",
  specialattck: "specialattack",
  specialatack: "specialattack",
  // Round 26: the 37 singular/plural category merges (per-pair evidence
  // and record-count math documented in the producer's
  // `_CATEGORY_GROUP_KEY_ALIASES` -- mirrored here verbatim, key-for-key,
  // to stay in lockstep with it, same convention as every entry above).
  classfeature: "classfeatures",
  alchemistclassfeature: "alchemistclassfeatures",
  antipaladinclassfeature: "antipaladinclassfeatures",
  arcanistclassfeature: "arcanistclassfeatures",
  barbarianclassfeature: "barbarianclassfeatures",
  bardclassfeature: "bardclassfeatures",
  brawlerclassfeature: "brawlerclassfeatures",
  cavalierclassfeature: "cavalierclassfeatures",
  clericclassfeature: "clericclassfeatures",
  druidclassfeature: "druidclassfeatures",
  fighterclassfeature: "fighterclassfeatures",
  gunslingerclassfeature: "gunslingerclassfeatures",
  hunterclassfeature: "hunterclassfeatures",
  inquisitorclassfeature: "inquisitorclassfeatures",
  investigatorclassfeature: "investigatorclassfeatures",
  kineticistclassfeature: "kineticistclassfeatures",
  magusclassfeature: "magusclassfeatures",
  mediumclassfeature: "mediumclassfeatures",
  mesmeristclassfeature: "mesmeristclassfeatures",
  monkclassfeature: "monkclassfeatures",
  occultistclassfeature: "occultistclassfeatures",
  paladinclassfeature: "paladinclassfeatures",
  rangerclassfeature: "rangerclassfeatures",
  rogueclassfeature: "rogueclassfeatures",
  shamanclassfeature: "shamanclassfeatures",
  shifterclassfeature: "shifterclassfeatures",
  skaldclassfeature: "skaldclassfeatures",
  slayerclassfeature: "slayerclassfeatures",
  spiritualistclassfeature: "spiritualistclassfeatures",
  summonerclassfeature: "summonerclassfeatures",
  swashbucklerclassfeature: "swashbucklerclassfeatures",
  vigilanteclassfeature: "vigilanteclassfeatures",
  warpriestclassfeature: "warpriestclassfeatures",
  witchclassfeature: "witchclassfeatures",
  wizardclassfeature: "wizardclassfeatures",
  racialtrait: "racialtraits",
};

function categoryGroupKey(raw) {
  const key = String(raw).toLowerCase().replace(/[^a-z0-9]/g, "") || "none";
  return CATEGORY_GROUP_KEY_ALIASES[key] || key;
}

// Mirrors the producer's category_label() fallback path (_humanize()) for
// the rare case a category exists in the shard but not in the shipped
// `categories`/`school_categories` label map (e.g. an older cached shard).
// The server-side label always wins when present; this only covers a gap.
function humanizeCategoryFallback(raw) {
  if (raw === "none") return "Uncategorised";
  let s = String(raw).replace(/_/g, " ").replace(/-/g, " ");
  s = s.replace(/([a-z0-9])(?=[A-Z])/g, "$1 ").replace(/([A-Z])(?=[A-Z][a-z])/g, "$1 ");
  s = s.replace(/\s+/g, " ").trim();
  return s ? s.replace(/\b\w/g, (c) => c.toUpperCase()) : raw;
}

// `raw` is the LOOKUP key (a `categoryGroupKey()` output for the type_facet
// axis, or a single school name for the school axis) -- it is what's used
// to find the server-shipped label in `meta.categories`/`school_categories`.
// `rawFallback`, added round 22 (finding 2), is the original UN-normalized
// segment (e.g. "RangerClassFeatures") to hand to humanizeCategoryFallback()
// when no server label is found -- `raw` itself is unusable there once it's
// a normalized group key (all lowercase, no word boundaries left to split).
function categoryLabelFor(kind, raw, axis, rawFallback) {
  const meta = ((DATA.unit_index || {}).kinds || {})[kind] || {};
  const map = axis === "school" ? (meta.school_categories || {}) : (meta.categories || {});
  return (map[raw] && map[raw].label) || humanizeCategoryFallback(rawFallback != null ? rawFallback : raw);
}

function categoryAxisColumn() {
  return unitState.categoryAxis === "school" ? "school" : "type_facet";
}

// Returns { by, rawByKey }: `by` is {groupKey: count}, `rawByKey` is
// {groupKey: oneRepresentativeRawSegment} (for humanizeCategoryFallback()
// when a group key has no server-shipped label -- see categoryLabelFor()).
//
// Round 22 QA finding 1: the `school` axis used to take the raw shard
// value directly with NO normalization -- every other axis went through
// categoryOfRaw(), but school bypassed it entirely, so a multi-school
// spell's raw pipe-delimited SCHOOL: token (e.g.
// "Abjuration|Necromancy|Transmutation") rendered as its OWN untranslated
// single-record chip instead of crediting the spell to each school it
// names. Now splits on "|" here too, same convention the producer's
// school_categories rollup already uses (round 21 finding 5) -- so level-2
// and level-3 numbers agree again for every school.
//
// Round 22 QA finding 2: the type_facet axis now runs categoryOfRaw()'s
// result through categoryGroupKey() so a CamelCase/space-separated
// duplicate pair merges into one chip instead of two identically-labelled
// ones (see categoryGroupKey() above).
function categoryChipCounts() {
  const { shard, book } = unitState;
  const col = categoryAxisColumn();
  const idx = shard.cols[col];
  if (idx == null) return null; // this shard has no such column at all
  const by = {};
  const rawByKey = {};
  shard.rows.forEach((r) => {
    if (book && r[shard.cols.book] !== book) return;
    const raw = r[idx];
    if (col === "school") {
      const schoolsHere = raw ? String(raw).split("|") : ["n/a"];
      schoolsHere.forEach((sch) => {
        by[sch] = (by[sch] || 0) + 1;
        if (rawByKey[sch] === undefined) rawByKey[sch] = sch;
      });
    } else {
      const rawSeg = categoryOfRaw(raw);
      const gkey = categoryGroupKey(rawSeg);
      by[gkey] = (by[gkey] || 0) + 1;
      if (rawByKey[gkey] === undefined) rawByKey[gkey] = rawSeg;
    }
  });
  return { by, rawByKey };
}

function renderCategoryFilters() {
  const { kind, shard } = unitState;
  const el2 = el("categoryChips");
  if (!el2) return;
  const isSpell = kind === "spell";
  const hasSchool = isSpell && shard.cols.school != null;
  const axisToggle = hasSchool ? `
    <span class="mono" style="color:var(--muted);margin-right:0.5em">Group by:</span>
    <button class="fchip${unitState.categoryAxis !== "school" ? " on" : ""}" id="axisTradition">Tradition</button>
    <button class="fchip${unitState.categoryAxis === "school" ? " on" : ""}" id="axisSchool">School</button>
    <span style="display:inline-block;width:1em"></span>` : "";
  const counts = categoryChipCounts();
  if (!counts) { el2.innerHTML = axisToggle; return; }
  const { by, rawByKey } = counts;
  const cats = Object.keys(by).sort((a, b) => by[b] - by[a]);
  const chips = cats.map((cat) => {
    const on = unitState.category === cat;
    const label = categoryLabelFor(kind, cat, unitState.categoryAxis, rawByKey[cat]);
    const isUncat = cat === "none" || cat === "n/a";
    return `<button class="fchip${on ? " on" : ""}${isUncat ? " uncategorised" : ""}" data-cat="${esc(cat)}">
      ${esc(label)} ${num(by[cat])}</button>`;
  }).join("");
  el2.innerHTML = axisToggle + chips;
  const at = el("axisTradition"), as = el("axisSchool");
  if (at) at.addEventListener("click", () => {
    unitState.categoryAxis = "type_facet"; unitState.category = ""; unitState.limit = UNIT_PAGE;
    renderCategoryFilters(); renderUnitRows();
  });
  if (as) as.addEventListener("click", () => {
    unitState.categoryAxis = "school"; unitState.category = ""; unitState.limit = UNIT_PAGE;
    renderCategoryFilters(); renderUnitRows();
  });
  document.querySelectorAll("#categoryChips .fchip[data-cat]").forEach((b) => {
    b.addEventListener("click", () => {
      const cat = b.dataset.cat;
      unitState.category = unitState.category === cat ? "" : cat;
      unitState.limit = UNIT_PAGE;
      renderCategoryFilters();
      renderUnitRows();
    });
  });
}

function renderUnitsShell() {
  const { kind, shard } = unitState;
  const books = [...new Set(shard.rows.map((r) => r[shard.cols.book]))].filter(Boolean).sort();

  el("view").innerHTML = `
    <div id="kindHeader"></div>
    <div class="searchbar">
      <input type="search" id="q" placeholder="Search ${esc(titleCase(kind))} by name or book…" autocomplete="off">
      <select id="bookSel">
        <option value="">All books (${books.length})</option>
        ${/* Round 24 QA finding 3: use the SAME title-resolution function the
             breadcrumb uses (bookTitleFor(), which prefers the curated title
             and disambiguates e.g. "Bestiary 1" from "Bestiary 2-6") instead
             of a separate titleCase(id) call here -- the two surfaces
             previously disagreed on display name for 3 books (bestiary,
             advanced_players_guide, adventurers_guide). */ ""}
        ${books.map((b) => `<option value="${esc(b)}"${b === unitState.book ? " selected" : ""}>${esc(bookTitleFor(b))}</option>`).join("")}
      </select>
    </div>
    <div class="filters" id="filterChips"></div>
    <div class="filters" id="categoryChips" style="margin-top:0.3em"></div>
    <div class="result-note" id="resultNote"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Book</th><th>How usable</th><th>Source</th></tr></thead>
      <tbody id="unitRows"></tbody>
    </table></div>
    <div id="moreWrap"></div>`;
  renderKindHeader();
  renderFilterChips();
  renderCategoryFilters();

  const q = el("q");
  let t = null;
  q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => { unitState.q = q.value.trim().toLowerCase(); unitState.limit = UNIT_PAGE; renderUnitRows(); }, 120);
  });
  el("bookSel").addEventListener("change", (e) => {
    // Round 16: switching books via this in-page dropdown (as opposed to
    // arriving with ?book= already on the URL) used to leave the header/
    // caveat frozen on whatever scope the page first loaded with, even
    // though resultNote below correctly recomputed live -- the exact same
    // corpus-vs-book contradiction as finding 1/2, just reachable one click
    // later. renderKindHeader() re-derives from unitState.book every time,
    // same as the initial render, so both stay in sync. Round 17: the chips
    // (finding 1) are the same shape of bug one surface over -- rebuild them
    // here too so header, chips, and table all move together.
    unitState.book = e.target.value; unitState.limit = UNIT_PAGE;
    unitState.category = "";
    renderKindHeader();
    renderFilterChips();
    renderCategoryFilters();
    renderUnitRows();
    // Round 17 fix (finding 5): keep the address bar in sync with what's on
    // screen so reload/back/share reproduce this exact view. Uses
    // replaceState rather than location.hash= so it does NOT fire the
    // window "hashchange" listener (which calls the full route() and would
    // tear down/rebuild this whole shard table, search box, and chip state
    // that round 16 and this round both went out of their way to update in
    // place instead).
    const url = unitState.book ? `#/kind/${kind}?book=${unitState.book}` : `#/kind/${kind}`;
    if (location.hash !== url) history.replaceState(null, "", url);
  });
  q.focus();
}

function filteredUnits() {
  const { shard, q, statuses, book, category } = unitState;
  const ci = shard.cols;
  const catCol = ci[categoryAxisColumn()];
  return shard.rows.filter((r) => {
    if (book && r[ci.book] !== book) return false;
    if (statuses.size && !statuses.has(r[ci.status])) return false;
    if (category && catCol != null) {
      const raw = r[catCol];
      // Round 22 QA finding 1: a multi-school spell's raw SCHOOL: token can
      // name more than one school ("Abjuration|Necromancy") -- membership
      // is "the selected school is ANY of the ones this record names", same
      // credit-every-school convention as categoryChipCounts() and the
      // producer's school_categories rollup, not a literal string match
      // against the raw pipe-delimited value.
      if (unitState.categoryAxis === "school") {
        const schoolsHere = raw ? String(raw).split("|") : ["n/a"];
        if (!schoolsHere.includes(category)) return false;
      } else {
        // Round 22 QA finding 2: match on the normalized group key so a
        // CamelCase/space-separated duplicate pair filters together.
        if (categoryGroupKey(categoryOfRaw(raw)) !== category) return false;
      }
    }
    if (q) {
      const name = String(r[ci.name] || "").toLowerCase();
      const bk = String(r[ci.book] || "").toLowerCase();
      if (!name.includes(q) && !bk.includes(q)) return false;
    }
    return true;
  });
}

function renderUnitRows() {
  const { shard, limit } = unitState;
  const ci = shard.cols;
  const rows = filteredUnits();
  const shown = rows.slice(0, limit);

  // Root-cause fix, round 4 (SD-29 QA finding F25, 2026-08-12): this column
  // used to show the raw `status` word only (via STATUS_LABEL), which is not
  // a doneness claim at all -- the same status word resolves to a different
  // doneness verdict depending on wiring_class (see donenessOf() above:
  // `grounded` on `static`/`derived` is `held`, not `done`). The producer now
  // ships `wiring_class` alongside `status` on every shard row so this "How
  // usable" column can show the real, per-record doneness verdict instead of
  // a raw status word under a "How usable" header that never matched what it
  // showed.
  const wcOf = (r) => (ci.wiring_class != null ? r[ci.wiring_class] : null) || "ambiguous";
  el("unitRows").innerHTML = shown.length ? shown.map((r) => {
    const st = r[ci.status] || "unknown";
    const verdict = donenessOf(wcOf(r), st, shard.kind) || "unmeasurable";
    const label = PLAIN_DONENESS_LABEL[verdict] || verdict;
    const color = DONENESS_COLOR[verdict] || "var(--muted)";
    // Plain-language only: the technical status/wiring_class words stay out
    // of this tooltip (they leak into `title=`, a real reader can hover it)
    // the same rule as everywhere else on this page -- raw vocabulary is
    // confined to the "For engineers" disclosure, never to a hover on the
    // main table.
    const detail = `${STATUS_LABEL[st] || st}, ${WIRING_CLASS_LABEL[wcOf(r)] || wcOf(r)}`;
    return `<tr>
      <td>${esc(r[ci.name])}</td>
      <td class="mono" style="color:var(--muted)">${esc(r[ci.book])}</td>
      <td><span class="pill st" style="background:${color}" title="${esc(detail)}">${esc(label)}</span></td>
      <td class="mono" style="color:var(--muted);font-size:0.9em">${esc(r[ci.source_file])}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">No records match these filters.</td></tr>`;

  // Never silently truncate: say exactly how many are hidden. Round 4 fix
  // (SD-29 QA finding F25/F28, 2026-08-12): this used to be a raw-status
  // PROVEN_STATUSES sum labeled "confirmed working" -- the same over-claim
  // bug as the landing Books card, on a different surface. Computed the same
  // way every other "fully usable" figure on the page now is: cross status
  // with wiring_class per row into a real doneness verdict, then route the
  // percentage through the unmeasurable/deferred-excluding denominator
  // (usableDenom), not the raw row count.
  const rowDoneness = {};
  rows.forEach((r) => {
    const v = donenessOf(wcOf(r), r[ci.status] || "unknown", shard.kind) || "unmeasurable";
    rowDoneness[v] = (rowDoneness[v] || 0) + 1;
  });
  const doneShown = rowDoneness["done"] || 0;
  const denomShown = usableDenom(rowDoneness, rows.length);
  // Round 18 fix (finding 3): under a book filter, the numerator is
  // book-scoped but this denominator is always corpus-wide (shard.rows.length
  // spans every book) -- label it so "N matching of TOTAL" doesn't read as a
  // claim about the current book.
  el("resultNote").innerHTML =
    `<strong>${num(rows.length)}</strong> matching of ${num(shard.rows.length)}` +
    (unitState.book ? " across all books" : "") + " " +
    `· ${num(doneShown)} fully usable (${pctCell(doneShown, denomShown)})` +
    (rows.length > shown.length ? ` · showing first <strong>${num(shown.length)}</strong>` : "");

  el("moreWrap").innerHTML = rows.length > shown.length
    ? `<button class="more" id="moreBtn">Show ${num(Math.min(UNIT_PAGE, rows.length - shown.length))} more</button>` : "";
  const mb = el("moreBtn");
  if (mb) mb.addEventListener("click", () => { unitState.limit += UNIT_PAGE; renderUnitRows(); });
}

/* ---- books ---- */

function inventoryFor(bookId) {
  const wi = DATA.work_inventory || {};
  const target = INVENTORY_ID_ALIASES[bookId] || bookId;
  return (wi.books || []).find((b) => b.id === target) || null;
}

/* Per-book doneness mini-bar (slice 2). Same ladder/labels as the overview
   and per-lane blocks, just scaled down; the book's own by_doneness ladder
   is already what the producer ships, no re-derivation needed here. */
function bookDonenessCell(byDoneness, units) {
  const by = byDoneness || {};
  if (!units || !Object.keys(by).length) return `<span class="na">n/a</span>`;
  assertLadderSums("book mini-bar", by, units);
