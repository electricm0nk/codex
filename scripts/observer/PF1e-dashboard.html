<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PF1e Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --fg: #e8e8ea;
  --bg: #0e1018;
  --panel: #181a23;
  --panel2: #1f222d;
  --muted: #6b7080;
  --border: #2a2d3a;
  --accent: #6abf7b;
  --warn: #d4a04a;
  --err: #c75050;
  --info: #6b9ad4;
  --full: #6abf7b;
  --partial: #d4a04a;
  --unassigned: #4a4f5e;

  /* Status vocabulary. Deliberately NOT a red/green binary: the generator
     distinguishes "we proved it" from "we have not looked", and collapsing
     those to a single "not done" colour is the misreading this dashboard
     exists to prevent. */
  --st-grounded: #6abf7b;
  --st-text-complete: #4f9e68;
  --st-ingested-magnitude: #6b9ad4;
  --st-engine-does-not-hold: #d4a04a;
  --st-not-started: #3a3f4e;
  --st-deferred: #8a7fb5;
  --st-unknown: #7a5f52;

  /* wiring_class vocabulary (added 2026-08-07, GE-09). Orthogonal to the
     status colours above -- this axis is "what kind of evidence would prove
     this unit", not "have we proved it". `ambiguous` gets its own colour on
     purpose: it is an undone work item, not a rounding error folded into
     something else. */
  --wc-display: #4f9e68;
  --wc-static: #6b9ad4;
  --wc-derived: #8a7fb5;
  --wc-computed: #d4a04a;
  --wc-ambiguous: #c75050;

  /* Doneness (added 2026-08-12, SD-29 decisions.md §46). This is the axis that
     answers "how done is this", and it is the CROSS of status x wiring_class,
     not a third independent vocabulary. `held` is a distinct colour from `done`
     on purpose -- it must never read as done, and it must never read as the
     same shade of unfinished as `in-progress`. `unmeasurable` is greyed toward
     the ground colour because it is a defect in the instruments, not a claim
     about the content. */
  --dn-done: #3fa66a;
  --dn-held: #5fa8a0;
  --dn-in-progress: #6b9ad4;
  --dn-not-started: #3a3f4e;
  --dn-unmeasurable: #7a5f52;
  --dn-deferred: #8a7fb5;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 1.45;
}
a { color: var(--info); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* ============================ header ============================ */
/* Round 28 fix (supervisor CSS-defect finding, 2026-08-13): `.header` is the
   ONLY element allowed to declare `position: sticky; top: 0` in this
   stylesheet. `.crumbs` below used to also claim `top: 0`, which put both
   elements in the same 0-offset sticky band with `.header` winning on
   z-index -- so once the page scrolled, `.crumbs` (and routeAndScroll()'s
   scroll target) landed hidden behind the header instead of below it.
   `--header-height` is measured at runtime (see syncHeaderHeight() in the
   script below, driven by a ResizeObserver on #header) because the header's
   height is no longer fixed -- the round-27 chip strip can wrap onto
   multiple lines depending on viewport width/content, so a hardcoded pixel
   offset would silently go stale the next time header content changes.
   `.crumbs`' `top` AND `scroll-margin-top` (Defect 2) both read this same
   variable so they cannot drift out of sync with each other. */
:root { --header-height: 0px; }
.header {
  position: sticky; top: 0; z-index: 20;
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 0.55em 1.2em;
}
.header-top {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 1em; flex-wrap: wrap;
}
.header h1 {
  margin: 0; font-size: 1em; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.freshness { font-size: 0.78em; color: var(--muted); }
.freshness.stale { color: var(--warn); }
.usage { display: flex; gap: 1.2em; font-size: 0.78em; flex-wrap: wrap; }
.usage .gauge { display: flex; flex-direction: column; align-items: flex-end; }
.usage .gauge .label { color: var(--muted); font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.05em; }
.usage .gauge .value { font-weight: 600; }

/* completion summary */
.completion { display: flex; align-items: center; gap: 1.1em; margin-top: 0.5em; flex-wrap: wrap; }
/* THE headline figure (SD-29 QA finding F27, round 4, 2026-08-12): the
   in-scope "fully usable" doneness percentage is the one number the
   surrounding prose calls "the headline" everywhere on this page, so it
   gets the most prominent treatment on the page — bigger than `.pct-big`
   ever was, since `.pct-big` used to be spent on secondary figures
   (classes/races counts) while this number rendered inside `.pct-caption`,
   2.5x smaller than the numbers around it. */
.headline-num { font-size: 3em; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.headline-num .unit { font-size: 0.35em; font-weight: 500; color: var(--muted); margin-left: 0.15em; }
/* F7 fix (round 5, SD-29 QA finding #7, 2026-08-12): `.pct-big`/`.pct-big
   .unit` deleted here -- dead since F27 (round 4) replaced its only user
   with `.headline-num`; grepped the file and confirmed no element still
   references the class before removing it. */
/* Secondary "quick status" figures (classes/races counts) — demoted below
   the headline's prominence, round 4 (F27): still legible, no longer
   competing with the one number that matters most on this page. */
.pct-small { font-size: 1.1em; font-weight: 600; line-height: 1.3; color: var(--fg); }
.pct-small .unit { font-size: 0.7em; font-weight: 500; color: var(--muted); margin-left: 0.15em; }
.pct-caption { font-size: 0.76em; color: var(--muted); max-width: 34em; }
/* `n/a` = no measurement attempt exists behind this figure at all --
   distinct from a real, measured `0`/`0%` (round 11, operator UI-first
   reframe, 2026-08-12). Deliberately NOT red/yellow (this is not a problem
   to fix, it's an honest "not yet checked") and deliberately NOT the same
   muted grey as ordinary secondary text, so it still stands out as its own
   token rather than blending into `.pct-caption`/`.of` prose. Uses the
   `--dn-unmeasurable` brown already reserved for "a gap in the instrument,
   not a claim about the content" (see the doneness palette above). */
.na { color: var(--dn-unmeasurable); font-style: italic; font-weight: 500; }
.bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden;
       flex: 1 1 260px; min-width: 200px; background: var(--st-not-started); }
.bar > span { display: block; height: 100%; }
.legend { display: flex; gap: 0.85em; flex-wrap: wrap; font-size: 0.72em; margin-top: 0.45em; color: var(--muted); }
.legend .chip { display: flex; align-items: center; gap: 0.35em; }
.legend .sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* Compact sticky-header lane selector (round 27 fix): one line-height chip
   per lane instead of renderByLane()'s full card (ladder, legend,
   capability sentence). Kept small on purpose -- the full grid now lives in
   the Overview view content, this is only "which lane, how done, jump" so
   the sticky header stays a fraction of the viewport rather than most/all
   of it. */
.lane-strip { display: flex; gap: 0.45em; flex-wrap: wrap; margin-top: 0.55em; }
.lane-chip {
  display: flex; align-items: center; gap: 0.5em;
  padding: 0.3em 0.65em; font-size: 0.78em;
}
.lane-chip .lane-chip-label { color: var(--fg); }
.lane-chip .lane-chip-pct { font-weight: 700; color: var(--muted); }
.lane-chip.selected-lane .lane-chip-pct { color: var(--info); }

/* ============================ nav / crumbs ============================ */
.crumbs {
  padding: 0.5em 1.2em; font-size: 0.82em; color: var(--muted);
  border-bottom: 1px solid var(--border); background: #14161e;
  position: sticky; top: var(--header-height, 0px); z-index: 10;
  /* Defect 2 fix: without scroll-margin-top, scrollIntoView({block:"start"})
     lands #crumbs' top edge at the viewport's literal top edge -- which is
     still underneath the sticky .header occupying that same band. Same
     --header-height variable as `top` above, on purpose (see comment on
     .header): one runtime measurement feeds both, so they cannot disagree. */
  scroll-margin-top: var(--header-height, 0px);
  display: flex; gap: 0.5em; align-items: center; flex-wrap: wrap;
}
.crumbs .sep { opacity: 0.5; }
.crumbs .here { color: var(--fg); }

main { padding: 1.1em 1.2em 4em; max-width: 1500px; margin: 0 auto; }

/* ============================ cards ============================ */
.grid { display: grid; gap: 0.8em; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.85em 0.95em; cursor: pointer; transition: border-color .12s, transform .12s;
}
.card:hover { border-color: var(--info); transform: translateY(-1px); }
.card.flat { cursor: default; }
.card.flat:hover { border-color: var(--border); transform: none; }
/* Round 21 QA finding 6: lane grid never showed which lane you're
   currently inside on its level-2/level-3 pages. Driven by route() via
   updateLaneSelection(), toggled on the matching .card[data-kind]. */
.card.selected-lane { border-color: var(--info); box-shadow: 0 0 0 1px var(--info) inset; }
.card h3 { margin: 0 0 0.15em; font-size: 0.93em; font-weight: 600; }
.card .sub { font-size: 0.76em; color: var(--muted); margin-bottom: 0.6em; }
.card .metric { display: flex; align-items: baseline; gap: 0.4em; margin-bottom: 0.45em; }
.card .metric .n { font-size: 1.35em; font-weight: 700; }
.card .metric .of { font-size: 0.78em; color: var(--muted); }

.section-title {
  font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin: 1.6em 0 0.6em; font-weight: 600;
}
.section-title:first-child { margin-top: 0; }

/* ============================ tables ============================ */
table { border-collapse: collapse; width: 100%; font-size: 0.85em; }
th, td { text-align: left; padding: 0.4em 0.7em; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.05em;
     position: sticky; top: 0; background: var(--bg); z-index: 2; }
tbody tr:hover { background: #171a24; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }

.pill { display: inline-block; padding: 0.08em 0.5em; border-radius: 10px;
        font-size: 0.88em; white-space: nowrap; }
.pill.st { color: #0e1018; font-weight: 600; }

/* ============================ search ============================ */
.searchbar { display: flex; gap: 0.6em; margin-bottom: 0.8em; flex-wrap: wrap; align-items: center; }
.searchbar input[type=search] {
  flex: 1 1 300px; min-width: 200px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
  color: var(--fg); padding: 0.5em 0.7em; font-size: 0.95em; font-family: inherit;
}
.searchbar input[type=search]:focus { outline: none; border-color: var(--info); }
.searchbar select {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
  color: var(--fg); padding: 0.5em 0.6em; font-size: 0.88em; font-family: inherit;
}
.filters { display: flex; gap: 0.4em; flex-wrap: wrap; margin-bottom: 0.7em; }
.fchip {
  border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  border-radius: 12px; padding: 0.18em 0.7em; font-size: 0.78em; cursor: pointer;
  display: flex; align-items: center; gap: 0.35em; font-family: inherit;
}
.fchip.on { color: var(--fg); border-color: currentColor; }
.fchip .sw { width: 8px; height: 8px; border-radius: 2px; }
/* Round 21 QA finding 9: emitted on the "none"/"n/a" category chip
   (renderCategoryFilters) with no matching rule -- dashed border marks it
   as the odd-one-out group, distinct from a real category chip, same
   muted-but-legible language as .pill's own "uncategorised" tag. */
.fchip.uncategorised { border-style: dashed; font-style: italic; }
.result-note { font-size: 0.8em; color: var(--muted); margin: 0.5em 0; }
.result-note strong { color: var(--fg); }

button.more {
  margin: 0.9em auto 0; display: block; background: var(--panel2); color: var(--fg);
  border: 1px solid var(--border); border-radius: 5px; padding: 0.5em 1.2em;
  font-size: 0.85em; cursor: pointer; font-family: inherit;
}
button.more:hover { border-color: var(--info); }

/* ============================ states ============================ */
.banner { padding: 0.6em 1em; border-radius: 5px; margin-bottom: 1em; font-size: 0.85em; }
.banner.err { background: #2a1618; border: 1px solid var(--err); color: #f0c0c0; }
.banner.warn { background: #2a2417; border: 1px solid var(--warn); color: #f0dcb0; }
.banner.info { background: #16202a; border: 1px solid var(--info); color: #c0dcf0; }
.empty { color: var(--muted); padding: 1.5em; text-align: center; font-size: 0.9em; }
.spinner { color: var(--muted); padding: 2em; text-align: center; }
.note-body { font-size: 0.85em; color: #c9ccd6; white-space: pre-wrap; margin-top: 0.4em; }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="header-top">
    <h1>PF1e Dashboard</h1>
    <div class="usage" id="usage"></div>
  </div>
  <div id="completion"></div>
</div>

<div class="crumbs" id="crumbs"></div>

<main>
  <div id="banner"></div>
  <div id="view"><div class="spinner">Loading dashboard data…</div></div>
</main>

<script>
"use strict";

const JSON_URL = "PF1e-dashboard.json";
const REFRESH_MS = 60000;

let DATA = null;
const SHARDS = new Map();   // kind -> {fields, rows}

/* The producer's status vocabulary, in the order it should read: proven first,
   then partial, then untouched. Keys match work_inventory.by_status exactly. */
const STATUS_ORDER = [
  "grounded", "text-complete", "ingested-magnitude",
  "engine-does-not-hold", "not-started", "deferred-with-reason", "unknown",
];
const STATUS_COLOR = {
  "grounded": "var(--st-grounded)",
  "text-complete": "var(--st-text-complete)",
  "ingested-magnitude": "var(--st-ingested-magnitude)",
  "engine-does-not-hold": "var(--st-engine-does-not-hold)",
  "not-started": "var(--st-not-started)",
  "deferred-with-reason": "var(--st-deferred)",
  "unknown": "var(--st-unknown)",
};
/* Matches the producer: only positive proof counts as done. ingested-magnitude
   is deliberately excluded -- the engine holds the numbers but no consumer
   delta was observed, and counting it would overstate completion. (Round 9,
   SD-29 QA: the PROVEN_STATUSES array that used to encode this was dead code
   -- confirmed by grep, only its own definition and comments referenced it --
   removed rather than left as an invitation to re-derive a raw-status number
   under doneness-shaped language. `proven` itself comes from the producer's
   `wi.proven_units`, not a client-side sum.) */

/* wiring_class (GE-09): orthogonal to status above. `computed` first because
   it carries the highest evidence bar (an observed consumer delta), then
   descending the lattice display < static < derived < computed, with
   `ambiguous` always last and always shown -- it is a work item, not folded
   into any "done" bucket and never hidden when its count is 0. */
const WIRING_CLASS_ORDER = ["computed", "derived", "static", "display", "ambiguous"];
const WIRING_CLASS_COLOR = {
  "computed": "var(--wc-computed)",
  "derived": "var(--wc-derived)",
  "static": "var(--wc-static)",
  "display": "var(--wc-display)",
  "ambiguous": "var(--wc-ambiguous)",
};

/* The class names are the determinator's vocabulary and stay authoritative in
   the payload, in `decisions.md`, and in every command a reader might run --
   but they do not say what the unit needs in terms anyone can act on, which is
   what made this panel unreadable. Render the plain phrasing, keep the
   technical word visible next to it rather than hidden in a tooltip, so a
   reader can still tie a bar back to the docs. */
const WIRING_CLASS_LABEL = {
  "computed": "changes the character sheet",
  "derived": "calculates from a formula",
  "static": "stores the book’s number",
  "display": "shows text",
  "ambiguous": "could not be classified",
};

/* Doneness (2026-08-12). Ladder order, best evidence first, matching the
   producer's DONENESS_VALUES exactly -- the two must not drift, and the viewer
   never re-sorts by count. `unmeasurable` and `deferred` sit at the end because
   neither is a rung: one is an instrument defect, the other a recorded ruling. */
const DONENESS_ORDER = [
  "done", "held", "in-progress", "not-started", "unmeasurable", "deferred",
];
const DONENESS_COLOR = {
  "done": "var(--dn-done)",
  "held": "var(--dn-held)",
  "in-progress": "var(--dn-in-progress)",
  "not-started": "var(--dn-not-started)",
  "unmeasurable": "var(--dn-unmeasurable)",
  "deferred": "var(--dn-deferred)",
};
const DONENESS_LABEL = {
  "done": "done",
  "held": "held — as proven as the instrument allows",
  "in-progress": "part way",
  "not-started": "not started",
  "unmeasurable": "can’t be measured",
  "deferred": "deferred, with a reason",
};

/* Plain-English rewrite of the ladder above (2026-08-12, "readability" pass).
   The operator named `grounded`/`derived` as specifically unreadable, and
   that verdict extends to every term of art this dashboard used to put in
   front of a reader: `held`, `wiring_class`, `status`, `unit`, `reach`,
   `computed`/`static`/`display`/`derived`, `ingested-magnitude`,
   `engine-does-not-hold`, `text-complete`, `ambiguous`. None of those words appear in
   PLAIN_DONENESS_LABEL or PLAIN_DONENESS_BLURB below, or anywhere else this
   dashboard renders by default -- the technical vocabulary (DONENESS_LABEL,
   STATUS_ORDER, WIRING_CLASS_ORDER, and everything derived from them) is
   still shipped, but only inside the collapsed "For engineers" disclosure
   built by renderEngineerDisclosure(), so an auditor can still tie a plain
   sentence back to the determinator's own words on request. */
/* F3 fix (round 5, SD-29 QA finding #3, 2026-08-12): PLAIN_DONENESS_LABEL
   (the doneness-ladder axis) and STATUS_LABEL (the raw-status axis, below)
   both render on the same screens -- e.g. the per-record "How usable"
   column and the filter chips above the same table -- describing two
   DIFFERENT, non-matching sets of rows. Four entries here used to share the
   EXACT string with a STATUS_LABEL entry ("held"/"ingested-magnitude" both
   "recorded, not yet double-checked"; "not-started" and STATUS's
   "not-started"/"engine-does-not-hold" both "not started"; "unmeasurable" and
   STATUS's "unknown" both "can't be measured yet"; "deferred" and STATUS's
   "deferred-with-reason" both "skipped on purpose"). Identical wording on
   two different axes reads as the SAME claim, so a chip and a pill built
   from different data can flatly contradict each other's tooltip while
   using the same words. Reworded every doneness-axis label to be visibly
   distinct from its raw-status counterpart; verified pairwise against
   STATUS_LABEL below (see the label-collision harness assertion). */
const PLAIN_DONENESS_LABEL = {
  "done": "fully usable",
  "held": "filed, but unconfirmed",
  "in-progress": "partly working",
  "not-started": "nothing done yet",
  "unmeasurable": "can’t be checked yet",
  "deferred": "intentionally left out",
};
/* One clause of plain-English context per rung, used as the tooltip/caption
   text in place of the old `meaning[v]` strings (which are full of the same
   banned vocabulary and only appear in the engineer disclosure now). */
/* F29 audit, re-verified round 5 (SD-29 QA finding #1, 2026-08-12): after
   round 5 reverted round 4's `ambiguous`+`grounded` -> `done` shortcut,
   `held` is once again ALL evidence-bearing statuses (`grounded`,
   `text-complete`, `ingested-magnitude`) under both `static`/`derived` units
   and `ambiguous` units -- a single, simpler member shape than round 4 left
   behind. The blurb below still holds: neither shape has had its evidence
   confirmed against the bar its wiring_class would require (unknown for the
   `ambiguous` case, known-but-uninstrumented for `static`/`derived`), which
   is exactly what "filed, but unconfirmed" (PLAIN_DONENESS_LABEL) and the
   blurb below both say. "real data" (not "real number") is kept from the
   round-4 wording so the sentence
   doesn't imply every `held` record is a numeric value -- a `text-complete`
   record can be prose (a description, a prerequisite list) with no number
   in it at all. */
const PLAIN_DONENESS_BLURB = {
  "done": "a player can rely on this without caveats.",
  "held": "the game has the real data on file, but nobody has finished checking that the game actually applies it correctly.",
  "in-progress": "partway there — some of what it needs exists, some doesn’t yet.",
  "not-started": "nobody has worked on this yet.",
  "unmeasurable": "our own checking tools can’t currently tell — a gap in the checker, not a claim about the content.",
  "deferred": "ruled out of scope on purpose, with a reason on record — not pending work.",
};

/* ======================= per-lane capability sentences =======================
   The operator's own bar: "classes calculate", "equipment costs money and
   weight, it also affects abilities (ie +1 long sword vs +2 long sword)".
   Each lane needs its OWN sentence, because "fully usable" means something
   different for a spell than for a suit of armor. Grounded in what the
   `wiring_class` lattice actually proves (see WIRING_CLASS_LABEL above,
   which is the source these were written from): `computed` wiring is the
   only class that reaches the game actually reading the number back out and
   using it; `static`/`derived` can prove the number is filed correctly but
   never graduate to "done" under today's checks (SD-29 decisions.md §46);
   `display` is text on a card. Written to describe what "done" proves for
   that lane, not to claim more than the ladder below it can back up. */
const LANE_ORDER = [
  "class", "race", "feat", "spell", "equipment", "equipment_modifier",
  "class_feature", "race_trait", "monster", "monster_ability", "companion",
];
const LANE_LABEL = {
  "class": "Classes",
  "race": "Races",
  "feat": "Feats",
  "spell": "Spells",
  "equipment": "Equipment",
  "equipment_modifier": "Equipment upgrades",
  "class_feature": "Class features",
  "race_trait": "Race traits",
  "monster": "Monsters",
  "monster_ability": "Monster abilities",
  "companion": "Companions & familiars",
};
const LANE_CAPABILITY = {
  "class": "A class is fully usable when the game can calculate its numbers for you, automatically, at every level — not just when its name and description are on file.",
  "race": "A race is fully usable when picking it actually grants the traits and bonuses the book promises, not just when the race is listed as an option.",
  "feat": "A feat counts as done here in two different senses this dashboard does not blur together: showing correctly on your sheet with its name, description and prerequisites (the great majority of what’s “done” today), and separately, visibly changing your character’s numbers or options in play — only a minority of “done” feats have been confirmed to do the second.",
  "spell": "A spell is fully usable when casting it actually applies its effect in play. Right now the game mostly has the spell’s stat block filed away, not its effect wired up — that’s a much bigger gap than the raw numbers below suggest.",

/* Plain rewrite of the raw status vocabulary (STATUS_ORDER below), used only
   where a per-record status has to be shown to a reader — the deep unit
   search table. Keeps the technical word available in a tooltip/disclosure
   rather than as the only label, same rule as everything above.

   Root-cause fix, round 4 (SD-29 QA finding F25, 2026-08-12): `status` and
   `doneness` are two DIFFERENT axes (see the doneness section below), and
   every round of QA so far has found a new place where a number built from
   this raw STATUS axis alone got shown with a label that sounds like a
   DONENESS claim -- round 1 summed `held` into "coverage", round 2 promoted
   `ambiguous` straight to "done", round 3 (this dict, previously) mapped
   both `grounded` and `text-complete` to "confirmed working" and used that
   on the landing page itself. The same status word does NOT mean the same
   doneness verdict under a different wiring_class (see donenessOf() below --
   `grounded` on a `static`/`derived` unit is `held`, not `done`), so no
   label built from `status` alone may ever claim "confirmed", "working",
   "usable", "done", or "complete". These labels describe what the STATUS
   OBSERVATION itself is -- an evidence/data-entry state -- never a usability
   claim. Anywhere this dashboard needs an actual usability claim, it must
   read `by_doneness`/`by_doneness_kind` (the wiring_class × status join),
   never `STATUS_LABEL` or a raw status-array sum alone. */
const STATUS_LABEL = {
  "grounded": "engine observed this in play",
  "text-complete": "written up in full",
  "ingested-magnitude": "recorded, not yet double-checked",
  "engine-does-not-hold": "not started",
  "not-started": "not started",
  "deferred-with-reason": "skipped on purpose",
  "unknown": "can’t be measured yet",
};

/* ...but `proven` is a FLOOR, not a completion figure, and showing it alone
   badly understates delivered work. Two structural reasons:

   1. `grounded` requires an OBSERVED consumer delta, and the inventory only
      probes a subset of kinds. STALE AS OF SD30-E0-F2 (2026-08-14): this used
      to name `companion` and `spell` as having no probe at all; re-checked
      against the live payload this cycle and found FALSE for both --
      `computed`-wiring-class `companion` reads 416 `grounded` of 793 and
      `computed`-wiring-class `spell` reads 46 `grounded` of 210. Both kinds'
      `NO_GROUNDING_PROBE` listing was removed in the same change (see that
      constant's declaration below). No kind is known to have zero probe
      coverage as of this cycle; if one is found, name it here with the
      re-derivation that found it, not a carried-forward guess.
   2. ~3,000 class features land at `unknown` because they are shared option
      pools (Domain Powers, Rage Powers, Discoveries) with no derivable
      per-class explanation id -- an instrument limit, not a gap.

   So report three tiers and let the reader pick the one they mean. (Round 9,
   SD-29 QA: the HELD_STATUSES array that used to encode this was dead code --
   confirmed by grep, only its own definition and comments referenced it --
   removed for the same reason as PROVEN_STATUSES above.) */
/* Kinds the inventory has no consumer-delta probe for; `grounded` is
   unreachable for them by construction. Round 2 fix (SD-29 QA finding #6,
   2026-08-12): round 1 listed `equipment` and `equipment_modifier` here from
   an assumption that turned out false -- the live payload has 133 `grounded`
   equipment records and 40 `grounded` equipment_modifier records (excl.
   beginner_box). Re-derived from `docs/work-inventory.json` directly rather
   than reused from the earlier draft; re-check this list against live data
   if the corpus or the probe's coverage changes. */
let NO_GROUNDING_PROBE = ["companion", "spell"];
/* This default is only a fallback for a payload from before the producer
   started shipping `no_grounding_probe_kinds` (round 8, SD-29 QA finding,
   2026-08-12) -- i.e. a cache old enough to predate this field entirely, for
   which `["companion", "spell"]` really was the producer's live value at the
   time. loadData() below overwrites it from
   `DATA.work_inventory.no_grounding_probe_kinds` whenever the payload HAS the
   field at all (`Array.isArray`, checked without a truthiness/`.length` gate
   since SD30-E0-F2, 2026-08-14 -- an intentionally empty shipped list must
   override this default too, not be treated as "field absent"), so the
   producer's `NO_GROUNDING_PROBE` stays the single source of truth instead of
   this array silently drifting out of sync with it again. Current live value
   (SD30-E0-F2): empty -- both kinds this default names now have a landed
   probe reaching a nonzero `grounded` count under `computed`. */

function sumStatuses(byStatus, keys) {
  return keys.reduce((a, s) => a + ((byStatus || {})[s] || 0), 0);
}

/* The curated book list and the work-inventory use different ids for the first
   Bestiary ("bestiary_1" vs "bestiary"). Without this the book's 1,027 units
   render as "no inventory data" while sitting right there in the payload. */
const INVENTORY_ID_ALIASES = { "bestiary_1": "bestiary" };

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");
const el = (id) => document.getElementById(id);
const num = (n) => (n == null ? "–" : Number(n).toLocaleString());
const pct = (a, b) => (!b ? 0 : (a / b) * 100);
const fmtPct = (p) => (p >= 10 ? p.toFixed(0) : p.toFixed(1));

/* n/a vs 0% (round 11, operator UI-first reframe, 2026-08-12): `pct`/`fmtPct`
   above collapse "denominator is 0" and "numerator is 0 of a real
   denominator" into the same rendered "0.0%" -- a genuine measured zero
   (we checked, nothing's there) and "we never checked this" must never
   look the same. `pctCell` is the one place that decision gets made, so
   every render site routes through it instead of re-deciding by hand.
   A `b <= 0` (zero, null, undefined, NaN) means no measurement attempt
   exists behind this figure -- there is nothing to divide by, so there is
   no percentage to report, literal token `n/a`. `b > 0` is a real,
   measured denominator; `a === 0` against it is a real, measured `0%`
   finding about the content, not an absence of one. NEVER summed or
   averaged elsewhere -- see the `.na` CSS rule for the distinct styling
   and every caller's "excluded" note for where an n/a cell is dropped out
   of a stated total. */
function pctCell(a, b) {
  if (!b || b < 0) return `<span class="na" title="not measured — no denominator to divide by">n/a</span>`;
  return `${fmtPct(pct(a, b))}%`;
}
const titleCase = (s) => String(s || "").replace(/[_-]/g, " ")
  .replace(/\b\w/g, (c) => c.toUpperCase());

// F6 fix (round 5, SD-29 QA finding #6, 2026-08-12): provenOf() (a raw
// PROVEN_STATUSES sum) was defined here and never called anywhere in this
// file -- confirmed by grep before deleting. Leaving a dead raw-axis helper
// in the file is exactly what kept making it easy to accidentally re-surface
// a raw-status number under doneness-shaped language; removed rather than
// left as an invitation for a 5th relocation.
function totalOf(byStatus) {
  return Object.values(byStatus || {}).reduce((a, b) => a + b, 0);
}

/* ======================= data loading ======================= */

async function fetchJSON(url) {
  const resp = await fetch(url, { cache: "no-store" });
  if (!resp.ok) throw new Error(`${url}: HTTP ${resp.status} ${resp.statusText}`);
  return resp.json();
}

/* Retry rather than dying on the first failure. The producer republishes this
   file every 5 minutes; a fetch landing mid-publish used to leave a permanently
   stuck error box until the operator reloaded by hand. */
async function loadData(attempt = 0) {
  try {
    DATA = await fetchJSON(JSON_URL);
    // Keep NO_GROUNDING_PROBE single-sourced from the producer (round 8,
    // SD-29 QA finding, 2026-08-12) -- see its declaration above.
    //
    // SD30-E0-F2 (2026-08-14) fix: this used to read
    // `if (Array.isArray(ngp) && ngp.length)`, which can only ever ADD kinds
    // to the client's hardcoded `["companion", "spell"]` default, never
    // shrink it -- an explicitly-EMPTIED payload list (falsy `.length`)
    // silently left the stale default in place instead of overriding it,
    // exactly the two-copies-of-the-same-fact hazard this single-sourcing
    // was built to prevent, just for the empty case rather than a new-kind
    // case. The producer emptied `NO_GROUNDING_PROBE` this cycle (`spell`
    // and `companion` both now land nonzero `grounded` under `computed`),
    // so an empty array is a real, intentional payload value now, not an
    // absent-field placeholder -- checked with `Array.isArray` alone, so it
    // is honored.
    const ngp = DATA && DATA.work_inventory && DATA.work_inventory.no_grounding_probe_kinds;
    if (Array.isArray(ngp)) NO_GROUNDING_PROBE = ngp;
    setBanner("");
    return true;
  } catch (e) {
    if (attempt < 3) {
      await new Promise((r) => setTimeout(r, 400 * Math.pow(2, attempt)));
      return loadData(attempt + 1);
    }
    // Keep whatever we last rendered on screen; a stale dashboard beats a blank one.
    setBanner(DATA
      ? `Refresh failed (${esc(e.message)}) — showing the last good data. Retrying.`
      : `Failed to load dashboard data: ${esc(e.message)}`, DATA ? "warn" : "err");
    return false;
  }
}

async function loadShard(kind) {
  if (SHARDS.has(kind)) return SHARDS.get(kind);
  const idx = (DATA.unit_index || {});
  const meta = ((idx.kinds || {})[kind]) || null;
  if (!meta) throw new Error(`no shard published for "${kind}"`);
  const shard = await fetchJSON((idx.shard_base || "units/") + meta.shard);
  const cols = {};
  (shard.fields || []).forEach((f, i) => { cols[f] = i; });
  const parsed = { kind, fields: shard.fields, rows: shard.rows || [], cols };
  SHARDS.set(kind, parsed);
  return parsed;
}

/* ======================= chrome ======================= */

function setBanner(html, kind) {
  el("banner").innerHTML = html ? `<div class="banner ${kind || "err"}">${html}</div>` : "";
}

function renderUsage() {

  if (!u || !Object.keys(u).length) { el("usage").innerHTML = ""; return; }
  const g = (label, val, reset) => `

}

/* ======================= provenance & readiness =======================

   This payload carries THREE different definitions of "done", from three
   different sources. Showing them undifferentiated is what made the numbers
   untrustworthy:

     1. Engine reachability   -- derived, `v06_class_state_dump`. A class counts
        only when every level 1-20 reaches HeadlessReceiptStatus::Computed.
        This is the real answer to "is v0.6 done".
     2. Manifest task state   -- HAND-MAINTAINED by the lead/orchestrator. Goes
        stale silently, and currently contradicts the engine.
     3. Corpus unit grounding -- derived, `v06_work_inventory`. How much of the
        44k-unit corpus is proven, across ALL books including future-state
        ones. Not a v0.6 completion measure at all.

   Every figure below states which of the three it is.                      */

function channelReadiness() {
  const mx = DATA.matrix || {};
  const out = {};
  const add = (ch, bucket, done) => {
    if (!ch) return;
    out[ch] = out[ch] || { classes: [0, 0], races: [0, 0] };
    out[ch][bucket][1] += 1;
    if (done) out[ch][bucket][0] += 1;
  };
  (mx.classes || []).forEach((c) => add(c.channel, "classes", c.state === "full"));
  (mx.races || []).forEach((r) => add(r.channel, "races", r.state === "full"));
  return out;
}

/* Contradictions and fixture data get reported, not silently rendered. */
function dataQualityIssues() {
  const issues = [];
  const cls = (DATA.matrix || {}).classes || [];
  const engineFull = cls.filter((c) => c.state === "full").length;
  const man = (DATA.manifests || {})["v0.6_class_breadth"] || {};
  const st = man.stats || {};
  const openItems = (st.pending || 0) + (st.in_progress || 0);
  if (cls.length && openItems && engineFull === cls.length) {
    issues.push({
      summary: `A separate tracking document hasn't caught up with the engine's own count of finished classes.`,
      detail: `The engine reports all <strong>${engineFull}</strong> v0.6 classes playable ` +
        `at every level 1&ndash;20 with 0 blocked, but the hand-maintained <code>v0.6_class_breadth</code> ` +
        `manifest still lists <strong>${openItems}</strong> as pending/in-progress. ` +
        `The manifest is stale &mdash; the engine figure is the one to trust.`
    });
  }
  const fixtures = [];
  Object.keys(DATA.manifests || {}).forEach((mid) => {
    ((DATA.manifests[mid] || {}).items || []).forEach((i) => {
      const blob = `${i.id || ""} ${i.scope || ""} ${i.claimed_by || ""}`.toLowerCase();
      if (/\btest\b/.test(blob)) fixtures.push(`${mid} → ${i.id}`);
    });
  });
  if (fixtures.length) {
    issues.push({
      summary: `A few internal test entries are mixed into the production counts, so some numbers may be slightly inflated.`,
      detail: `Test fixture rows are sitting in production manifests and inflating their counts: ` +
        `<code>${fixtures.map(esc).join("</code>, <code>")}</code>.`
    });
  }

  /* The summary panel is regenerated live by `v06_work_inventory --summary`,
     but the unit shards are built from the COMMITTED docs/work-inventory.json.
     Those two drift: the committed artifact only refreshes when someone
     regenerates and commits it, and on a shared checkout another agent's git
     operation can restore the stale version underneath you. When they
     disagree, the search layer is showing older truth than the headline. */
  const idx = DATA.unit_index || {};
  const wi2 = DATA.work_inventory || {};
  // Compare the numbers themselves, not their timestamps. A stale artifact can
  // be only minutes old and still describe a different world, which is exactly
  // what happened when the committed doc was restored to a pre-fix generation.
  if (idx.available && wi2.available &&
      typeof idx.proven_units === "number" && typeof wi2.proven_units === "number" &&
      idx.proven_units !== wi2.proven_units) {
    issues.push({
      summary: `Some numbers on this page may be out of date — the underlying data sources don't currently agree.`,
      detail: `<strong>Search data disagrees with the summary.</strong> The headline figures come ` +
        `from a live <code>v06_work_inventory --summary</code> run ` +
        `(<strong>${num(wi2.proven_units)}</strong> proven), but the searchable shards are built from ` +
        `the committed <code>docs/work-inventory.json</code> ` +
        `(<strong>${num(idx.proven_units)}</strong> proven, generated ${esc(idx.generated_at || "?")}). ` +
        `Per-unit statuses in the drill-downs are stale until that artifact is regenerated and ` +
        `committed — on a shared checkout another agent's git operation can restore the old one.`
    });
  }

  return issues;
}

/* In-scope units only. Feeds the SECONDARY line under the mandate headline
   (renderCompletion()) and the lane-page/book-page "measurable" figures,
   which stay in_scope-only this round (launch-readiness remediation Step
   4C explicitly left them as a labelled follow-up). The PRIMARY headline no
   longer reads from this function -- see `wi.mandate_headline`
   (operator ruling 2026-08-15, decisions.md Decision 5): the whole-corpus
   figure, future-state books included, IS the number that matters now. */
function inScopeUnits() {
  const wi = DATA.work_inventory || {};
  const books = (wi.books || []).filter((b) => b.scope === "in_scope");
  const agg = {};
  books.forEach((b) => {
    Object.keys(b.by_status || {}).forEach((s) => {
      agg[s] = (agg[s] || 0) + b.by_status[s];
    });
  });
  // F6 fix (round 5, SD-29 QA finding #6, 2026-08-12): this used to also
  // return raw-axis `proven`/`held` sums that nothing read (grepped every
  // call site: only `.books`, `.byStatus`, `.units`, `.byDoneness` are ever
  // accessed) -- dead raw-axis numbers sitting on a doneness-named object
  // are exactly the shape that keeps re-surfacing under doneness language.
  // `.gaps`/`.unknown` stay: also unread today, but they describe the
  // status axis honestly by name and aren't the pattern QA flagged.
  return {
    books,
    byStatus: agg,
    units: books.reduce((a, b) => a + (b.units || 0), 0),
    gaps: agg["engine-does-not-hold"] || 0,
    unknown: agg["unknown"] || 0,
    byDoneness: aggDoneness(books),
  };
}

/* Sum the per-book doneness ladders the producer now ships. Summed from the
   book rows rather than read off the corpus-wide `by_doneness` so the figure is
   scoped to in-scope books, the same way byStatus above is -- the corpus-wide
   key includes future-state books nobody has been asked to start. Zero-filled
   so an empty rung renders as a visible 0. */
function aggDoneness(books) {
  const agg = {};
  DONENESS_ORDER.forEach((v) => { agg[v] = 0; });
  (books || []).forEach((b) => {
    Object.keys(b.by_doneness || {}).forEach((v) => {
      agg[v] = (agg[v] || 0) + b.by_doneness[v];
    });
  });
  return agg;
}

function renderCompletion() {
  const wi = (DATA && DATA.work_inventory) || {};
  const node = el("completion");
  if (!wi.available) {
    node.innerHTML = `<div class="pct-caption">${esc(wi.note ||

    return;

  const proven = wi.proven_units || 0;
  const by = wi.by_status || {};
  // Raw evidence bar/legend — kept, but only inside the engineer disclosure
  // below (renderEngineerDisclosure). Not shown by default: this is the axis
  // that made the dashboard unreadable, per the operator.
  const rawSegs = STATUS_ORDER.filter((s) => by[s])
    .map((s) => `<span title="${esc(s)}: ${num(by[s])}" style="width:${(by[s] / total) * 100}%;background:${STATUS_COLOR[s]}"></span>`)
    .join("");
  const rawLegend = STATUS_ORDER.filter((s) => by[s]).map((s) =>
    `<span class="chip"><span class="sw" style="background:${STATUS_COLOR[s]}"></span>${esc(s)} ${num(by[s])}</span>`).join("");

  const gen = wi.generated_at ? new Date(wi.generated_at) : null;
  const ageMin = gen ? Math.round((Date.now() - gen.getTime()) / 60000) : null;

  const ready = channelReadiness();
  const v6 = ready["v0.6"];
  const inScope = inScopeUnits();

  // Round 4 fix (SD-29 QA finding F27, 2026-08-12): `.pct-big` (1.9em) used
  // to be spent on the classes/races counts here, while the actual "one
  // figure that matters" — the in-scope doneness percentage, THE headline
  // per the surrounding prose everywhere else on this page — rendered two
  // sections down inside a 0.76em muted `.pct-caption` paragraph, smaller
  // than every card metric on the page. Prominence now matches the framing:
  // the doneness percentage gets `.headline-num` (bigger than `.pct-big` ever
  // was), and classes/races are demoted to `.pct-small`, a secondary
  // "quick status" line below it, not the dominant visual.
  //
  // This also removes a second, previously undetected instance of the exact
  // recurring bug class this round exists to root out: the OLD fallback
  // headline (when no "v0.6" channel data exists) rendered `wi.proven_units`
  // — a straight PROVEN_STATUSES sum, i.e. the raw status axis — as a giant
  // `.pct-big` "%" figure directly under a caption reading "Classes/races a
  // player can actually use right now". A raw-status-axis number with a
  // doneness-shaped caption sitting on it is exactly finding F25's pattern;
  // it had just never been named because nobody happened to test the
  // no-v0.6-channel path. The one headline number was, at the time, always
  // the in-scope doneness percentage; v6-channel-availability did not
  // change what "the headline" meant. SUPERSEDED 2026-08-15 (operator
  // ruling, decisions.md Decision 5, launch-readiness remediation Step
  // 4C): the headline is now the whole-mandate percentage below, not the
  // in-scope one -- that figure moved to the secondary line.
  // Mandate headline (operator ruling 2026-08-15, decisions.md Decision 5,
  // launch-readiness remediation Step 4C): done against the WHOLE mandate
  // denominator -- every unit in every book except beginner_box, including
  // future-state books, unmeasurable and deferred. Nothing subtracted; the

  // an older JSON that predates `mandate_headline` (falls back to the raw
  // by_doneness/total_units the panel always carried, so a stale cache
  // still renders SOMETHING rather than crashing the page).
  const m = wi.mandate_headline || {
    done: (wi.by_doneness || {}).done || 0,
    denominator: wi.total_units || 0,
    unmapped_units: 0,
    secondary_in_scope_measurable: null,
  };
  const doneHeadline = m.done;
  const headlineDenom = m.denominator;
  const headlineNum = headlineDenom
    ? `<div class="headline-num">${fmtPct(pct(doneHeadline, headlineDenom))}<span class="unit">%</span></div>`
    : `<div class="headline-num na" style="font-size:0.5em;font-style:normal">n/a<span class="unit"> — nothing in the mandate could be measured</span></div>`;
  assertLadderSums("mandate headline", wi.by_doneness || {}, headlineDenom);
  const secondary = m.secondary_in_scope_measurable;
  const secondaryLine = secondary
    ? `<div class="pct-small">In-scope &amp; measurable (the previous headline): ${num(secondary.done)}` +
      `<span class="unit">/${num(secondary.denominator)} (${pctCell(secondary.done, secondary.denominator)})</span></div>`
    : "";
  const unmappedLine = m.unmapped_units > 0
    ? `<div class="pct-caption" style="color:var(--warn)">` +
      `${num(m.unmapped_units)} units carry no verdict — counted in the denominator, not in done.</div>`
    : "";

  // F1-fallout note (round 5, SD-29 QA finding #1, 2026-08-12): this
  // "N/N classes|races" count and the headline doneness % above it are TWO
  // DIFFERENT, INDEPENDENTLY-RUN checks that are not required to agree, and
  // after round 5's fix they visibly don't for races: this figure (the
  // v0.6 channel-readiness gate, `DATA.matrix.races`) can show "7/7 races
  // playable at every level 1-20" while the by-lane doneness page shows a
  // much lower "races fully usable" count, because a race's `wiring_class`
  // is `ambiguous` in the corpus today and the doneness ladder now (rightly)
  // caps an unresolved classification at what the `static`/`derived`
  // fidelity bar would allow, so it can only cost credit, never gain it.
  // Two real measurements, two different bars, not a contradiction — but
  // unexplained side by side they read as one, so this says so in place.
  const subhead = v6
    ? `<div class="completion" style="margin-top:0.2em">
         <div class="pct-small">${v6.classes[0]}<span class="unit">/${v6.classes[1]} classes</span></div>
         <div class="pct-small">${v6.races[0]}<span class="unit">/${v6.races[1]} races</span></div>
         <div class="pct-caption" style="max-width:24em">
           <strong>Classes/races a player can actually use right now</strong> — a class only
           counts once the game can work out every one of its numbers correctly at every
           level, 1 through 20, checked automatically rather than taken on anyone's word.
         </div>
         <div class="pct-caption" style="max-width:24em">
           This is a <strong>different check</strong> than the "fully usable" doneness figures
           elsewhere on this page (including for races, in "How usable is each kind of content?"
           below) — the two are independently run and don't always agree yet. This one
           asks "does the game correctly compute this at every level, 1-20?"; the doneness
           figures ask "has our checker actually confirmed this specific record's evidence
           against the bar its own kind of content needs?" A race can pass the first and still
           be short of the second if our checker hasn't yet been able to tell what kind of
           evidence that particular race's traits need — a gap in the checker, not a claim the
           traits don't work. (Technical detail in the collapsed engineering disclosures below.)
         </div>
       </div>`
    : "";

  // Round 27 QA finding (operator report, 2026-08-13): the sticky `.header`
  // used to hold the ENTIRE completion section -- headline, ladder, legend,
  // cross-tab disclosure, wiring-class block, and the full 11-card lane grid
  // (renderByLane) -- which made the sticky header plausibly fill (or
  // exceed) the viewport. #view (where route() renders level-2/level-3
  // content on a lane-card click) sits below that in the document with no
  // scroll handling anywhere in the file, so a click that correctly routed
  // and rendered still looked like "nothing happened": the new content was
  // real, just off-screen below a full-height sticky header.
  //
  // Fix, split in two: (1) route() now scrolls the reader to the newly
  // rendered content on real navigation (see maybeScrollToContent(), wired
  // to the hashchange listener only, not the refresh tick) and (2) the
  // sticky header itself shrinks to just what must persist across every
  // page -- the headline figure and a compact one-line-per-lane strip
  // (renderLaneStrip, below) so the lane list stays reachable at every
  // level per the earlier round's finding, without the full card grid's
  // ladders/legends/capability sentences eating the whole header. Those
  // stay real, full-detail content -- they move into the Overview view
  // (`#/`, viewLanding()) instead of persistent chrome. This function keeps
  // computing everything it always did (nothing about the DATA shape or the
  // doneness math changed); it just writes less of it into the sticky
  // header and stashes the rest in OVERVIEW_COMPLETION_HTML for viewLanding()
  // to place as ordinary page content. renderCompletion() always runs
  // before route() in both main() and the refresh tick (see boot section),
  // so this module-level string is guaranteed fresh by the time viewLanding()
  // reads it.
  node.innerHTML = `
    <div class="completion">
      ${headlineNum}
      <div class="pct-caption" style="max-width:26em">
        <strong>Fully usable, against the whole mandate</strong> — ${num(doneHeadline)}
        of ${num(headlineDenom)} records across all 37 books (incl. the 7 future-state books,
        unmeasurable and deferred — nothing subtracted). 100% is the bar.
      </div>
      ${secondaryLine}
      ${unmappedLine}
    </div>
    ${renderLaneStrip(wi)}`;

  OVERVIEW_COMPLETION_HTML = `
    ${subhead}
    ${renderDonenessBlock(wi, inScope)}
    ${renderByLane(wi)}
    ${renderEngineerDisclosure(wi, total, proven, rawSegs, rawLegend, ageMin)}`;
}

// Set by renderCompletion() every time it runs (boot + successful refresh
// ticks); read by viewLanding() to place the full doneness ladder, full lane
// card grid, and engineering disclosures as Overview page CONTENT rather
// than persistent sticky chrome. See the round-27 comment in
// renderCompletion() above for why this split exists.
let OVERVIEW_COMPLETION_HTML = "";

/* Compact, always-sticky version of renderByLane()'s card grid: one short
   chip per lane (label + doneness %), no ladder/legend/capability sentence.
   Keeps the earlier round's "the lane list must be reachable at every level"
   finding true without the full card grid's height living in the sticky
   header. Deliberately reuses `.card` + `data-kind` so updateLaneSelection()
   (which queries `#completion .card[data-kind]`) keeps highlighting the
   active lane here exactly as it did on the old full-size cards. */
function renderLaneStrip(wi) {
  const byKind = wi.by_doneness_kind || {};
  const kinds = Object.keys(byKind);
  if (!kinds.length) return "";
  const order = LANE_ORDER.filter((k) => kinds.includes(k))
    .concat(kinds.filter((k) => !LANE_ORDER.includes(k)));
  // Strict rule (operator ruling 2026-08-15, Step 4C): the sticky-header
  // chips share the SAME denominator as the mandate headline above them --
  // every unit in the lane, nothing subtracted -- rather than the old
  // usableDenom() (which dropped unmeasurable/deferred). Every other
  // usableDenom() call site (Overview ladder, lane pages, book pages) is
  // left as-is this round, labelled "measurable" honestly; deciding
  // page-wide is a logged follow-up, not this fix's scope.
  const chips = order.map((kind) => {
    const by = byKind[kind] || {};
    const denom = Object.values(by).reduce((a, b) => a + b, 0);
    const done = by["done"] || 0;
    const label = LANE_LABEL[kind] || titleCase(kind);
    return `<div class="card flat lane-chip" data-kind="${esc(kind)}"
      onclick="location.hash='#/lane/${esc(kind)}'" title="${esc(label)} — see the full breakdown on Overview or #/lane/${esc(kind)}">
      <span class="lane-chip-label">${esc(label)}</span>
      <span class="lane-chip-pct">${pctCell(done, denom)}</span>
    </div>`;
  }).join("");
  return `<div class="lane-strip">${chips}</div>`;
}

/* Raw instrument vocabulary, collapsed by default. Everything the dashboard
   used to show up front — status words (grounded/text-complete/…), the
   wiring_class lattice, and the joint cross-tab — still ships, for a reader
   who wants to audit a plain-English number back to the determinator's own
   terms. It just isn't the first thing on screen anymore. */
function renderEngineerDisclosure(wi, total, proven, rawSegs, rawLegend, ageMin) {
  return `
    <details style="margin-top:0.8em">
      <summary style="cursor:pointer;color:var(--muted);font-size:0.82em">For engineers — raw status/wiring_class vocabulary and the cross-tab</summary>
      <div class="completion" style="margin-top:0.5em">
        <div class="bar">${rawSegs}</div>
      </div>
      <div class="pct-caption" style="margin-top:0.4em">
        <strong>Evidence held</strong> — the raw status vocabulary the ladder above is
        built from. Whole corpus incl. future-state: ${num(proven)}/${num(total)}
        (${pctCell(proven, total)}) strictly proven. Bar shows all books.
        ${ageMin != null ? ` · inventory ${ageMin} min old` : ""}
      </div>
      <div class="legend">${rawLegend}</div>
      ${renderWiringClassBlock(wi, total)}
      ${renderCrossTab(wi)}
    </details>`;
}

/* ======================= doneness =======================
   The panel the operator actually asked for (2026-08-12). `by_status` and
   `by_wiring_class` are the two MARGINS of one table; how-done-is-this lives in
   its cells and cannot be recovered from either margin, which is why this
   dashboard could show both bars and still not answer the question. The
   producer now crosses them per unit (`doneness_verdict()`) and ships the
   ladder plus the joint `cross_tab`.

   Two rules this block must not break, both from SD-29 `decisions.md §46.4`:
   `held` is never summed with `done` into one headline figure, and
   `unmeasurable` counts toward neither coverage nor gap. */
/* Shared bar/legend renderers for any doneness ladder ({done, held,
   in-progress, not-started, unmeasurable, deferred} -> count) against a
   denominator — used for the in-scope overview (slice 1), the per-lane
   breakdown (slice 3, renderByLane) and the per-book mini bars (slice 2,
   viewBooks). Plain labels only; no wiring_class/status vocabulary.

   The two functions below split the "every rung visible, including zero"
   guarantee between them, not both to the same job (fixed stale comment
   here, SD-29 QA finding #14, round 2, 2026-08-12): donenessBarHtml is a
   proportional bar, so a rung at 0 has zero width and is filtered out --
   there is nothing to render, and a hidden 0-width segment costs nothing.
   donenessLegendHtml is the one that actually renders every rung
   unconditionally, including a literal "0" chip, which is what makes an
   empty "can't be measured yet" bucket read as "none of that" rather than
   "no run happened". Always render both together; the bar alone would drop
   that guarantee. */
function donenessBarHtml(by, denom) {
  if (!denom) return "";
  return `<div class="bar">${DONENESS_ORDER.filter((v) => by[v]).map((v) =>
    `<span title="${esc(PLAIN_DONENESS_LABEL[v])}: ${num(by[v])}" ` +
    `style="width:${(by[v] / denom) * 100}%;background:${DONENESS_COLOR[v]}"></span>`).join("")}</div>`;
}
function donenessLegendHtml(by) {
  return `<div class="legend">${DONENESS_ORDER.map((v) =>
    `<span class="chip" title="${esc(PLAIN_DONENESS_BLURB[v] || "")}">` +
    `<span class="sw" style="background:${DONENESS_COLOR[v]}"></span>` +
    `${esc(PLAIN_DONENESS_LABEL[v])} ${num(by[v] || 0)}</span>`).join("")}</div>`;
}
/* Ladder-sums-to-denominator check, run at render time rather than trusted.
   Logs to console (visible to anyone who opens devtools) instead of failing
   silently — a slice whose rungs don't add up is exactly the kind of bug
   this rebuild exists to catch, not paper over. */
function assertLadderSums(label, by, denom) {
  const sum = DONENESS_ORDER.reduce((a, v) => a + (by[v] || 0), 0);
  if (sum !== denom) {
    console.error(`doneness ladder mismatch: ${label} sums to ${sum}, denominator is ${denom}`);
  }
  return sum === denom;
}

/* Coverage/usability percentages must never carry `unmeasurable` OR
   `deferred` in their denominator (SD-29 decisions.md §46.4, QA finding #2
   round 2 / #21 round 3, 2026-08-12): `unmeasurable` counts toward neither
   coverage nor gap because the instrument failed, and `deferred` counts
   toward neither because it was ruled out of scope with a recorded reason --
   `DONENESS_MEANING["deferred"]` on the producer says plainly "not pending
   work", the same off-the-ladder status as `unmeasurable`. The ladder BAR
   still shows both as their own rungs against the full total (unchanged, and
   correct — see donenessBarHtml above); only percentage math routes through
   this. */
function usableDenom(by, total) {
  return Math.max(0, (total || 0) - (by["unmeasurable"] || 0) - (by["deferred"] || 0));
}

/* Round 13 fix (finding #2): the excluded-count clause attached to a
   fully-usable percentage was collapsing `unmeasurable` ("no instrument
   exists, can't be measured") and `deferred` ("intentionally left out, a
   recorded ruling") into one "excluded, can't be measured" phrase --
   accurate only for the unmeasurable portion. `deferred` is deliberate scope
   exclusion, not a tooling gap, per DONENESS_MEANING["deferred"]. Split them
   into their own clauses so each is labeled for what it actually is, and
   omit either clause when that count is zero so a row with only one kind of
   exclusion still reads cleanly. Shared by renderBookKindCross's denomNote
   and viewBook's book-card note so both use one accurate convention. */
function excludedClause(unmeasurable, deferred) {
  const parts = [];
  if (unmeasurable) parts.push(`${num(unmeasurable)} can't be measured`);
  if (deferred) parts.push(`${num(deferred)} intentionally left out`);
  return parts.length ? ` (${parts.join(", ")})` : "";
}

/* Round 14 fix (QA: same probeless-caveat bug reappeared on a 3rd/4th
   surface after round 13 fixed it in renderBookKindCross): the "gap in the
   checking tool" caveat is only true when there's real evidence on file
   (done/held/in-progress > 0) that the missing probe is preventing from
   reaching `done` -- on a kind that's 100% not-started (e.g. companion:
   {not-started: 1696}, zero everything else) there's nothing for a probe to
   excuse, and the caveat would contradict the adjacent legend's own
   "nothing done yet" count. Centralized here so renderByLane and viewCorpus
   (both of which use this exact wording) share one place to fix; the
   book×kind panel's differently-worded caveat applied its own inline copy of
   this same gate through round 15 (left untouched per round-14 scope) --
   round 16 (finding #3) merged it into a call to this helper too, so this is
   now the ONLY implementation of the gate+wording in the file. The kind
   detail page (viewUnits/renderKindHeader) also calls this helper, and as of
   round 16 feeds it a book-scoped `by` ladder when a book filter is active,
   not just the corpus-wide one. */
function probelessCaveat(kind, by, margin) {
  const hasEvidence = (by["done"] || 0) + (by["held"] || 0) + (by["in-progress"] || 0) > 0;
  if (!NO_GROUNDING_PROBE.includes(kind) || !hasEvidence) return "";
  return `<div class="pct-caption" style="margin:${margin || "0.3em 0 0"}">Can’t currently be confirmed by an
     automated check — our checking tools have no consumer-delta probe for this content
     type yet, which is a gap in the checking tool, not a claim these records are
     unfinished.</div>`;
}

function renderDonenessBlock(wi, inScope) {
  if (!wi.doneness_available) {
    return `<div class="pct-caption">${esc(wi.doneness_note ||
      "Completion isn't known right now — that's different from zero, we just can't measure it this moment.")}</div>`;
  }
  const by = inScope.byDoneness || {};
  const units = inScope.units || 0;
  const done = by["done"] || 0;
  const unmeasurable = by["unmeasurable"] || 0;
  const covDenom = usableDenom(by, units);
  assertLadderSums("in-scope overview", by, units);

  const unmapped = wi.doneness_unmapped || {};
  const unmappedKeys = Object.keys(unmapped);
  const unmappedNote = unmappedKeys.length
    ? `<div class="pct-caption" style="color:var(--wc-ambiguous)">
         <strong>${num(unmappedKeys.length)} record group(s)</strong> didn’t fit any rung above,
         so this ladder is short of the full count until that’s fixed.
       </div>`
    : "";

  return `
    <div class="section-title" style="margin-top:1.1em">How usable is the content right now?</div>
    <div class="pct-caption">
      This is the ladder behind the headline figure above: of the ${num(covDenom)} in-scope
      records that can actually be checked, ${num(done)} are
      <strong>${esc(PLAIN_DONENESS_LABEL["done"])}</strong> — a player can rely on them without
      caveats. ${num(unmeasurable)} more records are excluded from that percentage entirely
      (neither counted as usable nor as a gap) because our instruments can't measure them yet —
      see the “${esc(PLAIN_DONENESS_LABEL["unmeasurable"])}” rung below. The rest of the ladder is real, tracked progress
      toward done, not failure: most of it is content that's recorded in the engine but hasn't
      cleared our own double-check yet, which is a very different thing from not having been
      touched at all.
    </div>
    ${donenessBarHtml(by, units)}
    ${donenessLegendHtml(by)}
    <div class="pct-caption" style="margin-top:0.3em">
      Each record is judged against what its <em>own kind</em> of content needs to be usable —
      see “How usable is each kind of content?” below for what that means lane by lane. A record
      that only needs to show text counts as done once it renders; a record that needs to change
      your character's numbers counts as done only once that's been confirmed to actually happen.
      “${esc(PLAIN_DONENESS_LABEL["held"])}” is never added into the “${esc(PLAIN_DONENESS_LABEL["done"])}” figure above —
      those are two different claims, and only one of them has been verified.
    </div>
    ${unmappedNote}`;
}

/* ======================= per-lane breakdown (slice 3) =======================
   Corpus-wide, not in-scope-only. Slice 2 (books) and slice 3 (lanes) each
   stand on their own rather than being crossed here, and this block says so
   on screen rather than silently mixing a whole-corpus figure into an
   in-scope one. The book x kind cross this comment used to say the producer
   couldn't compute now exists (round 11, `by_doneness_book_kind`) — it lives
   per-book on the book page (renderBookKindCross), not here, since "how
   usable is Ultimate Equipment's equipment" is a book-scoped question a
   reader asks from that book's own page, not from this corpus-wide slice. */
/* The "done" figure is dominated by `display`+`text-complete`/`grounded` for
   most lanes -- proof the record renders, not that it changes anything in
   play. The one tier that proves the second, stronger claim is `computed`
   wiring_class crossed with `grounded` status (SD-29 QA finding #17, round 3,
   2026-08-12). Round 2 only hedged this in prose below the headline while the
   unqualified "fully usable" label stayed right next to the raw done count --
   QA's finding was that a hedge nobody's eye lands on doesn't fix a
   misleading number. This puts the sub-count ON the number itself, in every
   place a "done" figure is shown per kind, so the headline and its true
   meaning can never be read apart from each other. */
/* Round 4 fixes (SD-29 QA findings F30/F32, 2026-08-12):
   F30 — "correctly filed" used to describe both this suffix's non-mechanical
   remainder AND `held`'s own blurb, the same phrase on two different rungs
   either side of the done/not-done line — and "correctly" overclaimed on its
   own: presence in the engine was confirmed, correctness was not. Reworded
   to "present in the engine", distinct from held's blurb (worded again round
   5, see PLAIN_DONENESS_LABEL/PLAIN_DONENESS_BLURB above) and honest about
   what was actually verified.
   F32 — the producer now zero-fills `mechanically_confirmed_by_kind` for
   every kind seen, so a kind can genuinely read 0 rather than being absent.
   The `mc >= done` case used to suppress the suffix entirely, rendering
   `class` (27/27 mechanically confirmed, the best result in the corpus)
   identically to a kind this sub-count doesn't apply to at all. That case
   now reads as an explicit positive statement instead of nothing. */
/* Round 5 re-verification (SD-29 QA finding #2, 2026-08-12): the specific
   worry was a "done" record whose own `status` is `grounded` (i.e. really
   was observed in play) getting swept into this suffix's "not yet observed"
   remainder. `mechanically_confirmed_by_kind` only counts `computed`+
   `grounded`. At that point `DONENESS_DONE` was reachable two ways:
   `computed`+`grounded` (counted in `mc`) and `display`+(`text-complete`|
   `grounded`) (never counted in `mc`) -- and round 5 argued a `display`+
   `grounded` record landing in "the rest" was still fine, since a `display`
   unit can't change character state by construction.
   Round 6 (SD-29 QA, 2026-08-12) found that argument was itself the
   over-favorable read QA was hunting for: a `grounded` status on a
   `display` unit isn't neutral evidence, it's proof the `display`
   classification is probably wrong (see the `display` branch of
   `doneness_verdict()` in the producer), and crediting it as `done` at all
   was the bug. `display`+`grounded` no longer reaches `done` -- `done` is
   now reachable exactly one way for a non-`computed` kind: `display`+
   `text-complete`, which is never counted in `mc`. So every non-`computed`
   "done" record now lands in "the rest" by construction, and "not yet
   observed changing anything in play" is true for all of them (their status
   is `text-complete`, not `grounded` -- no consumer delta was ever observed
   for a `done`, non-mechanically-confirmed record post-fix). Machine-checked
   in structural.js against real shard data, not just this reasoning. */
function mechConfirmedSuffix(kind, done, wi) {
  if (!done) return "";
  const mc = (wi.mechanically_confirmed_by_kind || {})[kind] || 0;
  if (mc >= done) {
    return ` (all ${num(mc)} mechanically confirmed — the strongest evidence tier, an observed effect in play)`;
  }
  return mc > 0
    ? ` (${num(mc)} mechanically confirmed; the rest is present in the engine but not yet observed changing anything in play)`
    : ` (0 mechanically confirmed — present in the engine, none yet observed changing anything in play)`;
}

function renderByLane(wi) {
  const byKind = wi.by_doneness_kind || {};
  const kinds = Object.keys(byKind);
  if (!kinds.length) {
    return `<div class="pct-caption">Per-content-type breakdown isn’t available in this payload right now.</div>`;
  }
  // Any kind the payload has that isn't in our known order still renders,
  // appended at the end with a title-cased fallback label rather than being
  // dropped — a kind silently missing would read as "0 of that", not "we
  // forgot to add a row for it".
  const order = LANE_ORDER.filter((k) => kinds.includes(k))
    .concat(kinds.filter((k) => !LANE_ORDER.includes(k)));

  // Independent source of truth: the by-kind margin from the payload, NOT the
  // sum of the very ladder being checked. Round 1's check summed `by` and
  // compared it to itself (sum === sum, always true, could never catch a real
  // mismatch) — this is what let finding #8's unit_index drift go undetected
  // (SD-29 QA finding #10, round 2, 2026-08-12).
  const byKindTotals = wi.by_kind || {};
  const cards = order.map((kind) => {
    const by = byKind[kind] || {};
    const denom = Object.values(by).reduce((a, b) => a + b, 0);
    if (typeof byKindTotals[kind] === "number") {
      assertLadderSums(`lane: ${kind}`, by, byKindTotals[kind]);
    }
    const done = by["done"] || 0;
    const covDenom = usableDenom(by, denom);
    const unmeasurable = by["unmeasurable"] || 0;
    const deferred = by["deferred"] || 0;
    const label = LANE_LABEL[kind] || titleCase(kind);
    const capability = LANE_CAPABILITY[kind] ||
      `We don't yet have a written definition of "fully usable" for this content type.`;
    // Round 4 fix (SD-29 QA finding F31, 2026-08-12): this per-kind card
    // lives in the persistent header, rendered on every page — the
    // highest-traffic surface on the site — but was missing the same
    // probeless caveat viewCorpus/renderUnitsShell already carry. A reader
    // landing on companion/spell here saw a low "fully usable" % with no
    // explanation that the checking tool simply has no probe for that kind,
    // same gap finding #18 (round 3) already fixed on the other two pages.
    // Round 14 fix (finding #2): the caveat was still ungated here even
    // after round 13 added the hasEvidence gate to the book×kind panel --
    // now routed through the shared probelessCaveat() helper so this and
    // viewCorpus can't drift from that gate again.
    const probelessNote = probelessCaveat(kind, by);
    // Round 20 (three-level drilldown): this card is level 1. Clicking it
    // now drops to level 2 -- one panel per book for this same lane -- via
    // #/lane/<kind>, rather than being a dead end. #/kind/<kind> (the
    // corpus-wide, unfiltered record search) is still reachable one click
    // further in, from any book panel on that page.
    return `<div class="card flat" data-kind="${esc(kind)}" onclick="location.hash='#/lane/${esc(kind)}'" style="cursor:pointer">
      <h3>${esc(label)}</h3>
      <div class="sub">${esc(capability)}</div>
      <div class="metric"><span class="n">${pctCell(done, covDenom)}</span>
        <span class="of">${num(done)} / ${num(covDenom)} fully usable${mechConfirmedSuffix(kind, done, wi)}${excludedClause(unmeasurable, deferred)}</span></div>
      ${donenessBarHtml(by, denom)}
      ${donenessLegendHtml(by)}
      ${probelessNote}
      <div class="pct-caption" style="margin-top:0.5em">See the per-book breakdown &rarr;</div>
    </div>`;
  }).join("");

  return `
    <div class="section-title" style="margin-top:1.4em">How usable is each kind of content?</div>
    <div class="pct-caption">
      Whole corpus, every book we have (not just the ${num((wi.books || [])
        .filter((b) => b.scope === "in_scope").length)} in active scope) — this answers a
      different question from the ladder above (“how usable is what we've committed to right
      now”) and the two numbers are not meant to match. What counts as “fully usable” is
      different for every row; read the sentence under each name before comparing percentages
      across rows.
    </div>
    <div class="grid">${cards}</div>`;
}

/* ======================= level 2: one lane, every book ======================= */
/* Round 20 (three-level drilldown). Mirror of renderBookKindCross() in the
   OTHER direction: that function is "this book, every content type";
   viewLane() is "this content type, every book". No new producer rollup —
   `by_doneness_book_kind` (book -> kind -> doneness ladder) already has
   every number this needs, built round 11 for exactly this axis. Each book
   panel here links on to #/kind/<kind>?book=<id>, the existing level-3 page
   (built rounds 12/15/16/17/18), so this view's only new job is grouping
   that existing page's entry points by lane instead of leaving them
   reachable only from inside a book's own page. */
function bookTitleFor(inventoryBookId) {
  const found = (DATA.books || []).find(
    (x) => (INVENTORY_ID_ALIASES[x.id] || x.id) === inventoryBookId);
  return (found && found.title) || titleCase(inventoryBookId);
}

// Round 22 QA finding 4: `bookTitleFor()` above ALWAYS returns something
// displayable (falls back to a title-cased version of whatever id it's
// given), which is correct for its own job but means it cannot tell a
// caller "this id isn't a real book" -- callers that need to draw that
// distinction (the breadcrumb, below) need this instead.
//
// Round 23 QA finding 1: this used to validate against `DATA.books` alone --
// the 24-book CURATED list -- while the level-3 page's own <select>/table
// validate the SAME book id against the shard's own real book ids for this
// kind (37 real books corpus-wide, gathered from `by_doneness_book_kind`,
// same set viewLane()'s per-book cards above are built from). 13 real books
// have shard data and doneness ladders but aren't in the smaller curated
// list (inner_sea_races, book_of_the_damned_volume_1, ultimate_psionics,
// ...), so isKnownBookId() wrongly said "not a real book" for any of them --
// the breadcrumb fell back to "All books" while the select/table correctly
// showed the specific book, a 3-vs-1 surface disagreement reachable via
// ordinary navigation (69 of 233 book x kind cards, 30%). Fixed by
// validating against the SAME source of truth as the select/table:
// `by_doneness_book_kind[bookId][kind]`'s presence, the exact same
// condition viewLane() uses to decide whether a book gets its own card for
// this kind. `kind` is optional so old callers that truly mean "is this id
// a real book at all, for ANY kind" still work, but the breadcrumb (the one
// caller today) always passes it.
function isKnownBookId(inventoryBookId, kind) {
  const bookKind = ((DATA.work_inventory || {}).by_doneness_book_kind) || {};
  const byBook = bookKind[inventoryBookId];
  if (!byBook) return false;
  if (!kind) return true;
  const byKind = byBook[kind];
  return !!(byKind && Object.values(byKind).reduce((a, v) => a + v, 0) > 0);
}

/* Shared by the level-2 lane page (lane-wide, all books) and the level-3
   record list (book-scoped, computed client-side from the already-loaded
   shard — see renderCategoryChips()/categoryBreakdownForBook() below). Takes
   a {category: {label, done, held, ...}} map straight off the payload/shard
   and renders it with the SAME ladder/percentage pattern as every other
   doneness surface on this page — sums are a partition of `by category`, so
   they reconcile with the lane/book total by construction, not by a
   separately-maintained total. */
// Round 21 QA finding 4: rendering every raw category as its own row
// stopped being a "sub-category breakdown" once a lane had hundreds of
// them (class_feature: 582 groups, 87 of them singletons; race_trait:
// 365 groups) -- that's the corpus's raw type_facet vocabulary leaking
// through as if it were a considered category system, not a genuinely
// useful axis (checked first: there is no coarser dotted-path level or
// other axis in this data that collapses class_feature/race_trait to
// something materially smaller than "book", which the per-book cards
// above this section already show). Past this threshold, show the top
// groups by volume plus an honest statement, and collapse the full raw
// list behind an explicit disclosure instead of dumping it by default.
const CATEGORY_TABLE_COLLAPSE_THRESHOLD = 100;
const CATEGORY_TABLE_TOP_N = 15;
// Round 22 QA finding 5: a raw-group-count threshold alone missed
// `equipment_modifier` -- 80 groups, 53 of them singletons (66%), 40%
// uncategorised, the SAME shape of problem as class_feature/race_trait
// above just at a smaller absolute scale, so it kept rendering as a flat
// 80-row dump with no "too fine-grained" caveat. A lane where most groups
// are singletons is exactly the "one row per naming convention, not a
// considered category system" case this section exists to call out,
// regardless of whether the raw count alone clears 100 -- so trigger on
// EITHER condition, not just the raw count. 0.5 was picked to catch
// equipment_modifier (0.66) without newly catching any other lane checked
// at the time (companion 0.27, equipment 0.33, feat 0.25, race 0.33, monster
// 0.07 -- monster's problem is a large uncategorised bucket, not many
// singletons, so it correctly stays out of this condition and keeps its own
// separate majority-uncategorised note instead).
const CATEGORY_SINGLETON_RATIO_THRESHOLD = 0.5;

function categoryRowHtml(cat, c) {
  const catTotal = DONENESS_ORDER.reduce((s, v) => s + (c[v] || 0), 0);
  const done = c["done"] || 0;
  const covDenom = usableDenom(c, catTotal);
  const isUncat = cat === "none" || cat === "n/a";
  return `<tr>
    <td>${esc(c.label || titleCase(cat))}${isUncat ? ` <span class="pill" style="opacity:.7">uncategorised</span>` : ""}</td>
    <td class="num">${num(catTotal)}</td>
    <td class="num">${pctCell(done, covDenom)}</td>
    <td>${bookDonenessCell(c, catTotal)}</td>
  </tr>`;
}

function categoryTableHtml(axisLabel, rowsHtml) {
  return `<div class="table-wrap"><table>
      <thead><tr><th>${esc(axisLabel)}</th><th class="num">Records</th><th class="num">Fully usable</th>
        <th>How usable — full breakdown</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>`;
}

function categoryBreakdownHtml(kind, categories, axisLabel) {
  const keys = Object.keys(categories || {});
  if (!keys.length) {
    return `<div class="pct-caption">No sub-category data available for ${esc(titleCase(kind))} —
      see "For engineers" below for exactly why, if this lane's categories were left n/a.</div>`;
  }
  const total = keys.reduce((a, k) => a + DONENESS_ORDER.reduce((s, v) => s + (categories[k][v] || 0), 0), 0);
  const uncatKey = keys.find((k) => k === "none" || k === "n/a");
  const uncatTotal = uncatKey
    ? DONENESS_ORDER.reduce((s, v) => s + (categories[uncatKey][v] || 0), 0) : 0;
  const majority = total > 0 && uncatTotal > total / 2;
  const majorityNote = majority ? `<strong>Most ${esc(titleCase(kind))} in this corpus aren’t sorted into a
        category yet</strong> — the uncategorised row below is the majority of this lane, not a
        rounding error; treat every percentage above it with that in mind.` : "";

  // Round 22 QA finding 5: also trigger the "too fine-grained" honest-
  // framing treatment on a high singleton ratio, not just a high raw group
  // count — see CATEGORY_SINGLETON_RATIO_THRESHOLD above.
  const singletonCount = keys.filter((k) =>
    DONENESS_ORDER.reduce((s, v) => s + (categories[k][v] || 0), 0) === 1).length;
  const singletonRatio = keys.length ? singletonCount / keys.length : 0;
  if (keys.length > CATEGORY_TABLE_COLLAPSE_THRESHOLD || singletonRatio >= CATEGORY_SINGLETON_RATIO_THRESHOLD) {
    const sortedKeys = [...keys].sort((a, b) =>
      DONENESS_ORDER.reduce((s, v) => s + (categories[b][v] || 0), 0) -
      DONENESS_ORDER.reduce((s, v) => s + (categories[a][v] || 0), 0));
    const topKeys = sortedKeys.slice(0, CATEGORY_TABLE_TOP_N);
    const topRows = topKeys.map((cat) => categoryRowHtml(cat, categories[cat])).join("");
    const allRows = sortedKeys.map((cat) => categoryRowHtml(cat, categories[cat])).join("");
    return `
