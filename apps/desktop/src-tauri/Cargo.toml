[package]
name = "codex-desktop"
version = "0.14.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
# Mints fresh character ids for `import_character` (Storage Tier Minimal
# Fix). Already resolved transitively (tauri and other deps pull it in), so
# this is a direct-dependency promotion, not a new crate in the build graph.
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
codex = { path = "../../.." }
