<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1f2c"/>
      <stop offset="100%" stop-color="#101219"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8c537"/>
      <stop offset="55%" stop-color="#e0a624"/>
      <stop offset="100%" stop-color="#a8701a"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4f10"/>
      <stop offset="100%" stop-color="#4a2f08"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#f8c537" stroke-opacity="0.18" stroke-width="6"/>

  <!-- open book -->
  <g>
    <!-- left page -->
    <path d="M 256 150
             C 196 158, 128 146, 100 176
             C 88 238, 88 302, 100 350
             C 140 372, 202 368, 256 360
             Z" fill="url(#gold)"/>
    <!-- right page -->
    <path d="M 256 150
             C 316 158, 384 146, 412 176
             C 424 238, 424 302, 412 350
             C 372 372, 310 368, 256 360
             Z" fill="url(#gold)"/>
    <!-- page fold shading -->
    <path d="M 256 150 C 196 158, 128 146, 100 176 C 88 238, 88 302, 100 350 C 140 372, 202 368, 256 360 Z"
          fill="#000000" fill-opacity="0.08"/>

    <!-- spine -->
    <path d="M 246 150 C 250 148, 262 148, 266 150 L 266 362 C 262 366, 250 366, 246 362 Z" fill="url(#spine)"/>

    <!-- page lines -->
    <g stroke="#5a3c0e" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <line x1="140" y1="210" x2="215" y2="200"/>
      <line x1="140" y1="245" x2="215" y2="238"/>
      <line x1="140" y1="280" x2="215" y2="276"/>

      <line x1="297" y1="200" x2="372" y2="210"/>
      <line x1="297" y1="238" x2="372" y2="245"/>
      <line x1="297" y1="276" x2="372" y2="280"/>
    </g>
  </g>
</svg>
